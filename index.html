<style>
:root{
  --bg:#f5f2ec; --panel:#ffffff; --ink:#1b2333; --ink-2:#4a5468; --ink-3:#7a8296;
  --line:#e3ddd2; --navy:#1d2b45; --navy-2:#2a3c5f; --gold:#b08d57; --gold-soft:#f3ead9;
  --accent:#2f5aa8; --user:#1d2b45; --user-ink:#fff; --note:#fbf7ef; --warn:#a2452b; --chip:#ffffff;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.06);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --panel:#181e29; --ink:#e7e9ee; --ink-2:#b4bac7; --ink-3:#8a91a1;
    --line:#2a3242; --navy:#0d1422; --navy-2:#22314f; --gold:#d1b27a; --gold-soft:#2a2519;
    --accent:#8fb0ff; --user:#2a3c5f; --user-ink:#fff; --note:#1f222a; --warn:#ff9a7a; --chip:#1d2431;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#11151d; --panel:#181e29; --ink:#e7e9ee; --ink-2:#b4bac7; --ink-3:#8a91a1;
  --line:#2a3242; --navy:#0d1422; --navy-2:#22314f; --gold:#d1b27a; --gold-soft:#2a2519;
  --accent:#8fb0ff; --user:#2a3c5f; --user-ink:#fff; --note:#1f222a; --warn:#ff9a7a; --chip:#1d2431;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.logo{width:36px;height:36px;flex:none}
.brand h1{margin:0;font:600 19px/1.1 var(--serif);letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:#c9cfdb;letter-spacing:.3px}
header .spacer{flex:1}
.hbtn{white-space:nowrap;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.1)}
#menuBtn{display:none}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 20px}
aside h2{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-3);margin:14px 10px 8px}
.nav-region{border-radius:8px}
.nav-region>button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:550}
.nav-region>button:hover{background:var(--gold-soft)}
.nav-region .caret{transition:transform .15s;color:var(--ink-3);font-size:11px}
.nav-region.open .caret{transform:rotate(90deg)}
.nav-secs{display:none;padding:2px 0 6px 8px}
.nav-region.open .nav-secs{display:block}
.nav-secs button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav-secs button:hover{background:var(--gold-soft);color:var(--ink)}
.quick button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.quick button:hover{background:var(--gold-soft);color:var(--ink)}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
#ctxbar{display:none;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink-2);flex-wrap:wrap}
#ctxbar.show{display:flex}
.pill{background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:550;font-size:12.5px}
#ctxbar button{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px}
#chat{flex:1;overflow-y:auto;padding:22px 18px 10px;scroll-behavior:smooth}
.inner{max-width:860px;margin:0 auto}
.msg{margin:0 0 16px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{background:var(--user);color:var(--user-ink);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:80%;white-space:pre-wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;width:100%;min-width:0}
.card h3.title{margin:0 0 4px;font:600 19px/1.3 var(--serif)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);background:var(--bg)}
.tag.gold{border-color:var(--gold);color:var(--ink)}
.lead{color:var(--ink-2);margin:4px 0 10px}
.court{border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.court b{font-family:var(--serif)}
.court table{border-collapse:collapse;margin-top:6px;width:100%}
.court td{padding:3px 8px 3px 0;vertical-align:top;font-size:13.5px}
.court td:first-child{color:var(--ink-2);width:42%}
details.sec{border-top:1px solid var(--line);padding:8px 0}
details.sec:first-of-type{border-top:0}
details.sec>summary{cursor:pointer;list-style:none;font:600 15.5px/1.35 var(--serif);padding:4px 0;display:flex;gap:8px;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .15s;display:inline-block}
details.sec[open]>summary::before{transform:rotate(90deg)}
.secbody{padding:2px 0 4px 18px;min-width:0}
.secbody p{margin:6px 0}
.secbody h4{margin:12px 0 4px;font:600 14.5px var(--serif);color:var(--ink-2)}
.secbody ol,.secbody ul{margin:6px 0;padding-left:22px}
.secbody li{margin:5px 0}
.secbody ol>li::marker{font-weight:700;color:var(--gold)}
.note{background:var(--note);border-left:3px solid var(--gold);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}
.note .lbl{font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.6px;color:var(--warn);display:block;margin-bottom:2px}
.fn{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.tw{overflow-x:auto;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--gold-soft);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.chip:hover{border-color:var(--gold);background:var(--gold-soft)}
.chip.primary{border-color:var(--gold)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.act:hover{border-color:var(--gold);color:var(--ink)}
.disclaimer{font-size:12px;color:var(--ink-3);margin-top:10px}
form#ask{border-top:1px solid var(--line);background:var(--panel);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.askrow{max-width:860px;margin:0 auto;display:flex;gap:10px}
#q{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;outline:none}
#q:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
#send{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}
footer{max-width:860px;margin:6px auto 0;font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.csel{margin:8px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;max-width:100%}
.welcome h3{font:600 22px/1.25 var(--serif);margin:0 0 6px}
.mail{overflow-wrap:anywhere}
.court td{overflow-wrap:anywhere}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:62px 0 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:86%;max-width:340px;box-shadow:var(--shadow)}
  aside.open{transform:none}
  #scrim{position:fixed;inset:62px 0 0 0;z-index:19;background:rgba(15,23,40,.35);display:none;cursor:pointer}
  #scrim.show{display:block}
  #menuBtn{display:inline-block}
  .brand p{display:none}
  header{gap:10px;padding:10px 12px}
  .brand h1{font-size:17px}
  #ctxbar{padding:6px 10px}
  #ctxbar>span:first-child{display:none}
  .bubble{max-width:90%}
  #chat{padding:14px 10px}
  .card{padding:14px}
  .secbody{padding-left:6px}
}
@media print{aside,header,form#ask,#ctxbar,.chips,.actions{display:none!important}.app{display:block}#chat{overflow:visible}}
</style>

</div>
<script>
const KB = {"general":[{"title":"How to Use This Guide","blocks":[{"t":"p","text":"**Wayfinder** is a civil litigation clerk's guide to the Ontario Superior Court of Justice Practice Directions — a first stop before you open the Court's website. It covers everything civil: filing and Case Center, short and long motions and applications, confirmations, urgent and consent matters, case conferences, pre-trials, trial scheduling, mediation, transfers, mortgages, administrative dismissals, costs, construction liens, the Commercial List, class actions and bankruptcy."},{"t":"p","text":"**Part I** covers the steps that apply everywhere, followed by the province-wide rules from the Consolidated Civil Provincial Practice Direction. **Part II** has one chapter per region, broken down topic by topic. **Part III** is a set of comparison charts for quick reference."},{"t":"note","label":"CURRENCY:","items":["This guide reflects the eight regional Practice Directions and the Consolidated Civil Provincial Practice Direction (updated October 19, 2026) as they appeared on the Court's website in **November 2026**. Practice Directions change often, sometimes without much notice. Before booking anything, open the region's Practice Direction (linked in each chapter) and confirm the effective date has not changed.","This guide is a practical reference for law clerks. It is not legal advice and does not replace the Rules of Civil Procedure, the Practice Directions or the instructions of supervising counsel."]}],"h1":true},{"title":"PART I — GENERAL PRINCIPLES","blocks":[],"h1":true},{"title":"Step 1: Classifying Your Motion or Application","blocks":[{"t":"p","text":"Counsel has requested you prepare and schedule a motion or application. In order to begin, here are the details you require:"},{"t":"ol","items":["Determine the Proceeding: Is this a **Motion** (brought within an existing action or application, Form 37A) or an **Application** (a stand-alone proceeding commenced by a Notice of Application, Form 14E, that must first be issued by the Court)?","Determine Notice: Is the Motion **On Notice** or **Without Notice** (*Ex Parte*)?","Determine Judicial Jurisdiction: Can the Motion be heard before an **Associate Judge** or must it be heard by a **Judge**?{{Associate Judges may hear most civil motions, but not those reserved to a Judge by rule 37.02(2) (e.g. motions for an injunction or involving the liberty of the subject). Not every courthouse has an Associate Judge; check the regional chapter. Applications are heard by a Judge.}}","Determine Consent: Is the Motion **Contested** or **On Consent/Unopposed**?","Determine Length: Is it a Short Motion?{{Most regions treat a short motion as one hour or less. Toronto and some East Region locations allow up to two hours. Always check the regional chapter.}} (Generally **1 hour or less**) or is it a Long Motion? (Generally **over 1–2 hours**){{Summary Judgment Motions are widely considered Long Motions.}}","Determine Jurisdiction: In which region is this Motion being brought? (Generally, this will be the region in which the matter was commenced.)"]},{"t":"p","text":"All cities that have a dedicated courthouse are grouped into eight Regions: ***Toronto***, ***Central West***, ***Central East***, ***Central South***, ***East***, ***Northeast***, ***Northwest*** and ***Southwest***."},{"t":"p","text":"The following chart will help you identify which region your city falls in:"},{"t":"table","headers":["Region","Cities",""],"rows":[["Toronto",["[130 Queen – Divisional Court](https://www.ontariocourts.ca/scj/locations/130-queen/)","[47 Sheppard – Small Claims](https://www.ontariocourts.ca/scj/locations/47-sheppard/)"],["[330 University Ave – Civil](https://www.ontariocourts.ca/scj/locations/330-univ/)","[393 University – Civil](https://www.ontariocourts.ca/scj/locations/393-univ/)"]],["Southwest",["[Chatham](https://www.ontariocourts.ca/scj/locations/chatham/)","[Goderich](https://www.ontariocourts.ca/scj/locations/goderich/)","[London](https://www.ontariocourts.ca/scj/locations/london/)","[Sarnia](https://www.ontariocourts.ca/scj/locations/sarnia/)"],["[St. Thomas](https://www.ontariocourts.ca/scj/locations/st-thomas/)","[Stratford](https://www.ontariocourts.ca/scj/locations/stratford/)","[Windsor](https://www.ontariocourts.ca/scj/locations/windsor/)","[Woodstock](https://www.ontariocourts.ca/scj/locations/woodstock/)"]],["Northwest",["[Dryden – Small Claims](https://www.ontariocourts.ca/scj/locations/dryden/)","[Fort Frances](https://www.ontariocourts.ca/scj/locations/fort-frances/)","[Kenora](https://www.ontariocourts.ca/scj/locations/kenora/)"],["[Red Lake – Small Claims](https://www.ontariocourts.ca/scj/locations/red-lake/)","[Thunder Bay](https://www.ontariocourts.ca/scj/locations/thunderbay/)"]],["Northeast",["[Cochrane](https://www.ontariocourts.ca/scj/locations/cochrane/)","[Elliot Lake – Small Claims](https://www.ontariocourts.ca/scj/locations/elliot-lake/)","[Gore Bay](https://www.ontariocourts.ca/scj/locations/gore-bay/)","[Haileybury](https://www.ontariocourts.ca/scj/locations/haileybury/)","[Kirkland Lake – Small Claims](https://www.ontariocourts.ca/scj/locations/kirkland-lake/)"],["[North Bay](https://www.ontariocourts.ca/scj/locations/north-bay/)","[Parry Sound](https://www.ontariocourts.ca/scj/locations/parry-sound/)","[Sault Ste. Marie](https://www.ontariocourts.ca/scj/locations/sault-ste-marie/)","[Sudbury](https://www.ontariocourts.ca/scj/locations/sudbury/)","[Timmins](https://www.ontariocourts.ca/scj/locations/timmins/)"]],["East",["[Alexandria – Small Claims](https://www.ontariocourts.ca/scj/locations/alexandria/)","[Belleville](https://www.ontariocourts.ca/scj/locations/belleville/)","[Brockville](https://www.ontariocourts.ca/scj/locations/brockville/)","[Cornwall](https://www.ontariocourts.ca/scj/locations/cornwall/)","[Kingston](https://www.ontariocourts.ca/scj/locations/kingston/)","[Kingston – Family](https://www.ontariocourts.ca/scj/locations/kingston-family/)","[L'Orignal](https://www.ontariocourts.ca/scj/locations/lorginal/)"],["[Morrisburg – Small Claims](https://www.ontariocourts.ca/scj/locations/morrisburg/)","[Napanee](https://www.ontariocourts.ca/scj/locations/napanee/)","[Ottawa](https://www.ontariocourts.ca/scj/locations/ottawa/)","[Pembroke](https://www.ontariocourts.ca/scj/locations/pembroke/)","[Perth](https://www.ontariocourts.ca/scj/locations/perth/)","[Picton](https://www.ontariocourts.ca/scj/locations/picton/)"]],["Central West",["[Brampton](https://www.ontariocourts.ca/scj/locations/brampton/)","[Burlington – Small Claims](https://www.ontariocourts.ca/scj/locations/burlington/)","[Guelph](https://www.ontariocourts.ca/scj/locations/guelph/)","[Milton](https://www.ontariocourts.ca/scj/locations/milton/)"],["[Orangeville](https://www.ontariocourts.ca/scj/locations/orangeville/)","[Owen Sound](https://www.ontariocourts.ca/scj/locations/owen-sound/)","[Walkerton](https://www.ontariocourts.ca/scj/locations/walkerton/)"]],["Central East",["[Barrie](https://www.ontariocourts.ca/scj/locations/barrie/)","[Bracebridge](https://www.ontariocourts.ca/scj/locations/bracebridge/)","[Cobourg](https://www.ontariocourts.ca/scj/locations/cobourg/)","[Lindsay](https://www.ontariocourts.ca/scj/locations/lindsay/)","[Newmarket](https://www.ontariocourts.ca/scj/locations/newmarket/)"],["[Orillia – Small Claims](https://www.ontariocourts.ca/scj/locations/orillia/)","[Oshawa](https://www.ontariocourts.ca/scj/locations/oshawa/)","[Peterborough](https://www.ontariocourts.ca/scj/locations/peterborough/)","[Richmond Hill – Small Claims](https://www.ontariocourts.ca/scj/locations/richmond-hill/)"]],["Central South",["[Brantford](https://www.ontariocourts.ca/scj/locations/brantford/)","[Cayuga](https://www.ontariocourts.ca/scj/locations/cayuga/)","[Hamilton – Family](https://www.ontariocourts.ca/scj/locations/hamilton/)","[Hamilton (John Sopinka)](https://www.ontariocourts.ca/scj/locations/hamilton-sopinka/)"],["[Kitchener](https://www.ontariocourts.ca/scj/locations/kitchener/)","[Simcoe](https://www.ontariocourts.ca/scj/locations/simcoe/)","[St. Catharines](https://www.ontariocourts.ca/scj/locations/st-catharines/)","[Welland](https://www.ontariocourts.ca/scj/locations/welland/)"]]]}]},{"title":"Practice Directions and You","blocks":[{"t":"p","text":"Each region has dedicated Practice Directions that dictate procedures for Civil Motions and Applications. Each regional Practice Direction sits on top of the province-wide [Consolidated Civil Provincial Practice Direction](https://www.ontariocourts.ca/scj/filing-procedures/provincial/consolidated-civil-provincial-practice-direction/) (last updated October 19, 2026). Where the two conflict, the regional Practice Direction governs. The chart below links you to each region's Practice Direction and shows the date it was last changed."},{"t":"table","headers":["Region","Practice Direction","Effective / Last Updated"],"rows":[["Toronto","[Consolidated Practice Direction – Toronto Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-toronto-region/)","Effective October 14, 2025"],["Central East","[Consolidated Practice Direction – Central East](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-east-region/)","Effective June 30, 2025; updated July 7, 2026"],["Central West","[Consolidated Practice Direction – Central West](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-west-region/)","Effective June 1, 2026"],["Central South","[Consolidated Practice Direction – Central South](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-south-region/)","Effective June 30, 2025; updated August 21, 2026"],["East","[Practice Direction – East Region](https://www.ontariocourts.ca/scj/practice_directions/practice-direction-for-the-east-region/)","Effective June 30, 2025"],["Northeast","[Consolidated Practice Direction – Northeast](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-northeast-region/)","Effective May 1, 2026"],["Northwest","[Consolidated Practice Direction – Northwest](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-northwest-region/)","Effective June 30, 2025 (dated September 29, 2025)"],["Southwest","[Consolidated Practice Direction – Southwest](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-southwest-region-2/)","Effective June 30, 2025; updated May 1, 2026"]]}]},{"title":"Filing Portals","blocks":[{"t":"p","text":"Every civil document must be filed electronically through the correct portal. Documents filed through the wrong portal will be rejected."},{"t":"table","headers":["Region","Portal","Notes"],"rows":[["Toronto only","[Ontario Courts Public Portal (\"OCPP\")](https://courts.ontario.ca/)","Replaced Justice Services Online in Toronto on October 14, 2025. Must be accessed from within North America. Each filing is limited to 500 pages."],["All other regions","[Justice Services Online (\"JSO\") – Civil Claims Online / Civil Submissions Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)","Use Civil Claims Online to issue originating process and Civil Submissions Online for everything else."]]},{"t":"h3","text":"How to File a Document"},{"t":"ol","items":["**Save each document as a separate, text-searchable PDF** named under the File Naming Protocol (see Step 3). Signed and commissioned documents must be fully executed before you file them.","**Sign in** to the correct portal (Public Portal in Toronto; Civil Submissions Online everywhere else).","**Choose the filing type:** a new case (to issue a Notice of Application) or a document in an existing case. For an existing case, enter the court file number and the courthouse.","**Select the document type** for each PDF (e.g. Notice of Motion, Motion Record, Factum, Affidavit of Service, Confirmation Form) and upload it.","**Pay the fee** where one applies (the motion fee is paid with the Notice of Motion; the application fee when the application is issued).","**Watch for the acceptance email.** The filing is only complete when the court accepts it and returns a court-stamped copy. Save the stamped copy to the client file; this is the version you upload to Case Center.","If a filing is **rejected**, read the reason, fix it and re-file immediately. A rejected filing does not stop any deadline."]},{"t":"p","text":"**Portal help line:** 1-800-980-4962 (toll-free) or 647-438-0403. TTY 416-368-4202 / 1-833-820-0714. Email CourtsPortal@ontario.ca (OCPP) or CivilClaimsOnline@ontario.ca (JSO)."},{"t":"p","text":"**Filing by email** is only permitted in limited cases: the matter is urgent and includes a request for an urgent hearing; the hearing or deadline is three business days or fewer away (five business days in Central West); the documents are sealed; or there is an accessibility or technology barrier. Each region publishes its own filing email addresses (see the regional chapters)."}]},{"title":"Calendly and You","blocks":[{"t":"p","text":"Several regions use [Calendly](https://www.ontariocourts.ca/scj/guides-and-service-resources/how-to-use-calendly/how-to-use-calendly-to-schedule-an-appearance-with-the-court/) so parties can request a date directly. The Court keeps a [list of which locations use Calendly](https://www.ontariocourts.ca/scj/guides-and-service-resources/how-to-use-calendly/judicial-regions-and-court-locations-using-calendly-2/). A few rules apply everywhere:"},{"t":"ul","items":["Confer with all parties and agree on a date **before** you book. Only one party completes the booking.","Open the courthouse's Calendly page, choose the event type that matches your hearing (e.g. \"Civil – Regular Motion\", \"Civil Practice Court\", \"Triage Court\") and the correct length of time, pick the date, then answer every question (court file number, short title, parties, counsel emails, relief, whether the date is on consent).","Use **\"Add Guests\"** to add every other party's email so they receive all notices automatically.","Calendly only reserves a date. It does **not** replace filing, fees or confirmation.","Confirmation emails come from notifications@calendly.com or no-reply@calendly.com. Forward the confirmation to all other parties (unless you used \"Add Guests\"), and keep a PDF copy for your filing.","To cancel or reschedule, use the buttons in the Calendly email and include the court file number in the \"Reason for cancelling\" field. Do not call the trial office to confirm a Calendly booking."]}]},{"title":"Step 2: Scheduling Your Motion or Application","blocks":[{"t":"p","text":"Motion scheduling can become quite complex, as every region has its own method. Be sure you understand the procedure for the specific jurisdiction before you book. Turn to the region's chapter in **Part II**, find the type of hearing (Short Motion, Long Motion, Short Application or Long Application), and follow the steps in order."},{"t":"note","label":"Note to discuss with Counsel:","items":["It is best practice, and expected by the Court in every region, that any scheduling for a Motion or Application be discussed with all affected responding parties before a date is booked. Several regions will not accept a booking or a timetable unless the parties have conferred."]},{"t":"p","text":"For **Applications**, remember the Notice of Application must be **issued** (through Civil Claims Online, or OCPP in Toronto) before it can be served. In several regions you must book the hearing or triage date first and file the Calendly confirmation with the Notice of Application."}]},{"title":"Rules of Civil Procedure Timelines","blocks":[{"t":"p","text":"The [Rules of Civil Procedure](https://www.ontario.ca/laws/regulation/900194) set the minimum timelines below. Regional Practice Directions frequently **shorten the time you have** (for example, earlier confirmation deadlines in Toronto, or factums 14 days before the hearing in Central East). Where a regional Practice Direction or a court-ordered timetable sets a different deadline, follow it."},{"t":"table","headers":["Step","Motion","Application"],"rows":[["Notice served","Notice of Motion (Form 37A) served at least **7 days** before the hearing (r. 37.07(6))","Notice of Application (Form 14E) issued, then served at least **10 days** before the hearing (**20 days** if served outside Ontario) (r. 38.06(3))"],["Notice filed","Filed with proof of service at least **7 days** before the hearing (r. 37.08(1))","Proof of service filed at least **7 days** before the hearing (r. 38.06(4))"],["Moving / Applicant's Record","Served and filed at least **7 days** before the hearing (r. 37.10(1))","Served and filed at least **7 days** before the hearing (r. 38.09(1))"],["Responding Record","Served and filed at least **4 days** before the hearing (r. 37.10(3))","Served and filed at least **4 days** before the hearing (r. 38.09(3))"],["Moving / Applicant's Factum","Served and filed at least **7 days** before the hearing (r. 37.10)","Served and filed at least **7 days** before the hearing (r. 38.09)"],["Responding Factum","Served and filed at least **4 days** before the hearing (r. 37.10)","Served and filed at least **4 days** before the hearing (r. 38.09)"],["Confirmation","Form 37B by **2:00 p.m., 5 days** before the hearing (r. 37.10.1). Unconfirmed motions are not heard.","Form 38B by **2:00 p.m., 5 days** before the hearing (r. 38.09.1). Unconfirmed applications are not heard."]]},{"t":"note","label":"Counting Days (r. 3.01):","items":["Exclude the first day and include the last day. Where a period is **7 days or less**, holidays (including every Saturday and Sunday) are **not** counted. Service made after 4:00 p.m. is deemed made on the next day that is not a holiday.","Always verify the current wording of the Rules on e-Laws before relying on a deadline. Diarize every deadline with reminders."]}]},{"title":"Step 3: Motion Materials, Filing and Case Center","blocks":[{"t":"h3","text":"Motion Materials and You"},{"t":"p","text":"Motion Records consist primarily of the following:"},{"t":"ol","items":["Motion Record Cover Page and Backpage","Index of Motion Record","A Notice of Motion (Form 37A)","Supporting Affidavit(s), including Exhibits","Draft Order{{The Draft Order is not always required in the Motion Record, but several regions require it as a separate document in Word format.}}{{In the case of Ex Parte Motions and Motions In Writing, a Draft Order is absolutely required. When filing with the Ontario Courts Public Portal, the Draft Order must also be filed separately in both PDF and Word format.}}"]},{"t":"p","text":"Application Records follow the same structure, using the issued Notice of Application (Form 14E) in place of the Notice of Motion."},{"t":"p","text":"ACL is a powerful software that can assist with drafting these documents, but ultimately it will be up to you to finalize and compile the Motion Record."},{"t":"h3","text":"Factums, Compendiums and Costs Outlines"},{"t":"ul","items":["**Factums** are required on all Long Motions and Applications and encouraged on Short Motions. The limit is **20 pages** unless leave is granted (**15 pages** in the Northeast).","Every factum must hyperlink its authorities to a free public source such as CanLII, with paragraph pinpoints, and must include counsel's signed certification of the authenticity of every authority cited (r. 4.06.1(2.1)).","A **Compendium** (r. 4.05.3) contains only the excerpts of evidence and case law you will actually refer to in argument. It is mandatory in Central East where more than 25 pages of documentary evidence are filed, and in the East and Southwest where more than 30 pages are filed.","Bring a **Costs Outline** (Form 57B, no more than three pages) to every contested hearing."]},{"t":"h3","text":"Case Center Upload"},{"t":"p","text":"[Case Center](https://ontariocourts.casecenter.thomsonreuters.com/) is the court's electronic hearing platform. The Judge reads your materials there, not from the portal. Uploading to Case Center is **not** filing: **only documents the court has already accepted** may be uploaded."},{"t":"ol","items":["**Get access.** After the Notice of Motion/Application is filed, court staff send a Case Center **invitation email** for the hearing's **bundle** (one bundle per court event). Accept it and sign in. If no invitation arrives, email the local court filing office with the court file number, short title, hearing date and the emails of everyone who needs access (in Toronto, court staff upload filed documents for you). Forward any change of counsel or contact details right away.","**Open the correct bundle** for the hearing date (e.g. \"Motion – 28-APR-2026\"). Uploading to the wrong bundle means the Judge will not see the document.","**Upload each document separately**: the court-stamped PDF (with bookmarks imported), named under the File Naming Protocol. Factums and draft orders are uploaded in **Word**. Upload in this order: factum, motion/application record, compendium, transcripts, exhibit books, authorities, costs outline.","**Check the upload.** Open each document in Case Center and confirm the bookmarks and hyperlinks work and nothing is missing. No document may exceed **500 pages**.","**Upload the Confirmation** to the same bundle once it has been filed (most regions require this; court staff will not do it for you).","**Never delete** an uploaded document. If a corrected version is needed, upload it with a clear name and tell the Court in the Confirmation.","**Review the bundle at least 24 hours before the hearing**, and again the morning of."]},{"t":"p","text":"Do not upload sealed or unredacted confidential material; email it to the trial coordination office instead. Help: [Guide to Requirements](https://www.ontariocourts.ca/scj/guides-and-service-resources/case-center/), info.CaseCenter@ontario.ca or 1-800-980-4962 (Monday–Friday, 8:30 a.m.–5:00 p.m.)."},{"t":"h3","text":"File Naming Protocols"},{"t":"p","text":"The Ontario Courts have their own naming protocol for every document uploaded to the Ontario Courts Public Portal, Justice Services Online or Case Center. The correct format is as follows:"},{"t":"p","text":"**[Document Type] – [Party Type] – [Party Name] – [Date in DD-MMM-YYYY]**","align":"center"},{"t":"p","text":"*Example:* Motion Record – Plaintiff – Smith Corp – 28-APR-2026","align":"center"},{"t":"p","text":"Do not include firm-specific naming conventions, abbreviations, court file numbers or form numbers in a document name."}]},{"title":"Step 4: Confirmation of Motion or Application","blocks":[{"t":"p","text":"Arguably the most vital step of the entire process. Once the Motion has been scheduled and the materials prepared, served and filed, the Motion must be confirmed by way of a **Confirmation of Motion** (Form 37B) or **Confirmation of Application** (Form 38B), or the regional form that replaces it. If it is not done by the deadline, **the date will be vacated** or the matter will not be heard."},{"t":"p","text":"Every region sets its own deadline and method (portal, email to the Trial Coordinator, Case Center upload, or a combination). The exact deadline, address and subject line for each region are in the regional chapters and in the Part III chart."},{"t":"h3","text":"How to Complete the Confirmation Form"},{"t":"ol","items":["**Confer first.** Email or call the other side to agree on the issues that will actually be argued, the materials the Judge must read, and the time each party needs. Most regions say failing to confer can lead to costs.","**State who is confirming** (moving party, responding party, or jointly) and the hearing date, time and courthouse.","**State the status of the motion:** proceeding on all issues; proceeding on some issues only; adjourned on consent to a specific date (or, in Central South, to the agreed \"Week of\" Ready List); resolved on consent; or abandoned. Say whether a consent order or draft order has been filed.","**List the specific issues** the Judge must decide, one per line. Never write \"all issues\".","**List the materials the Judge must read**, with the document name, volume, tab and Case Center page numbers (and paragraph numbers for affidavits). Never write \"all affidavits\".","**Give the time estimate** for each party, including reply, and the total.","**Flag anything unusual:** late or non-compliant materials (and a request for leave), interpreters, a request for a different mode of hearing, or a sealing order.","**Sign and date it**, then file/send it by the regional method and upload it to Case Center where required. Email a copy to all parties."]},{"t":"note","label":"If things change after you confirm:","items":["If the motion settles, is adjourned on consent, or drops an issue after the Confirmation is filed, tell the Trial Coordinator immediately and file and upload a **revised** Confirmation."]}]},{"title":"Step 5: The Hearing and After","blocks":[{"t":"ul","items":["Check the Case Center bundle the day before the hearing and confirm every document is there.","Have the draft order in Word ready to send to the Court if requested.","Endorsements and orders are generally released through Case Center. Diarize any terms in the endorsement (new timetables, costs submissions deadlines, return dates).","If the order is not signed at the hearing, prepare the formal order, obtain approval as to form and content where required, and submit it for signing and entry."]}]}],"provincial":[{"title":"Province-Wide Rules (Consolidated Civil Provincial PD)","blocks":[{"t":"p","text":"The [Consolidated Civil Provincial Practice Direction](https://www.ontariocourts.ca/scj/filing-procedures/provincial/consolidated-civil-provincial-practice-direction/) (last updated October 19, 2026) applies to every civil proceeding in the Superior Court except Divisional Court and Small Claims. Each regional Practice Direction sits on top of it; where they conflict, the regional one governs. **Toronto** follows its own Regional PD for filing and Case Center because it uses the Ontario Courts Public Portal."}],"h1":true},{"title":"Provincial – Court Communications by Email","blocks":[{"t":"p","text":"Never write to a judge directly. Email the court filing or trial coordination office for the courthouse (addresses are in each regional chapter), and **copy every other party** on every email and letter (paras 17, 19)."},{"t":"table","headers":["Part of the email","Must include (para 18)"],"rows":[["Subject line",["Level of court (S.C.J. or Div. Ct.)","Type of matter: civil, commercial list or estates","Court file number (or **NEW** if none)","Originating court location","Type of document (e.g. motion, conference brief, request)","Short title of proceeding","Hearing date, if set"]],["Body",["Court file number (or NEW)","Short title","Hearing date, if set","List of documents attached","Type of request","Sender's name, role (counsel, representative or party), email and phone"]]]},{"t":"p","text":"*Example subject line:* S.C.J. – Civil – CV-26-00012345-0000 – Barrie – Confirmation of Motion – Smith v. Jones – Hearing 01-DEC-2026"}]},{"title":"Provincial – Filing, Fees and Email Filing","blocks":[{"t":"ul","items":["Outside Toronto, file and issue through **Justice Services Online** — Civil Claims Online (issuing) and Civil Submissions Online (everything else): [ontario.ca/page/file-civil-or-divisional-court-documents-online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online) (para 1). A document is filed on the date the registrar shows on it or in the confirmation (para 3).","Filings must include prior orders and endorsements relevant to the request (para 4) and respect page limits and the naming protocol (para 6).","**Email or counter filing** is only allowed where (para 11): (1) the matter is urgent, including a request for an urgent hearing; (2) the hearing or deadline is **three business days or fewer** away; (3) the documents are sealed or support a sealing motion; or (4) an accessibility or technology barrier prevents e-filing. Some regions are broader (Central West: fewer than 5 business days).","If you file by email, keep the **signed, sworn or certified originals** until the case is finally over (or the appeal period expires) and produce them on request (para 13).","**Fees** are paid when the document is submitted: through the portal, in person, by phone credit card, or by cheque payable to the **\"Minister of Finance\"** with a covering letter giving the court file number, title, document filed, filing date, filing party and counsel (paras 14–15). Fee waivers: [Court Fee Waiver Guide](https://www.ontario.ca/page/have-your-court-fees-waived) (para 16).","Online filing help: 1-800-980-4962 · 647-438-0403 · TTY 416-368-4202 · CivilClaimsOnline@ontario.ca (para 10)."]}]},{"title":"Provincial – Case Center Rules","blocks":[{"t":"ul","items":["Uploading is **not** filing; only filed documents may be uploaded, and the filed version prevails over the uploaded one (paras 23–24). Upload whether the hearing is virtual or in person (para 25), promptly after the court accepts the filing or you are invited into the case (para 26).","**Where things go (para 28):** pleadings → Pleadings bundle; all orders and endorsements → Orders and Endorsements bundle; everything for the hearing (factums, records, transcripts, compendium, participant information form, exhibits) → the bundle created for that hearing. Never upload to the master bundle (para 29).","**Order in the hearing bundle:** (1) Factum; (2) Motion/Application/Trial Record and Compendium; (3) Transcripts; (4) Exhibit Books; (5) Abbreviated Book of Authorities; (6) Bill of Costs / Costs Outline; (7) Participant Information Form; (8) anything else permitted.","**Participant Information Form:** names of counsel and self-represented parties, how they wish to be addressed, and time estimates for oral submissions — uploaded only, not filed.","**Exhibits:** upload each one separately (the registrar can only stamp one exhibit per document).","Maximum **500 pages** per document (para 30). PDFs with \"Import Bookmarks\"; **factums and draft orders in Word** (para 33). Never delete an upload (para 31).","**Never upload** (para 35): unredacted documents subject to (or proposed for) a sealing order — email them to the trial coordination office asking that they be forwarded to the presiding judge, and after a virtual hearing file a sealed hard copy with the order attached; unredacted materials on a motion to get off the record (r. 15.04) or redacted Rule 7 materials (r. 7.08(4.2)–(4.3)) — email them to trial coordination and upload only the redacted version.","If the other side uploads something improperly, add a \"widely shared\" case note in Case Center and flag it on your confirmation form (para 36). At the hearing, refer to Case Center page numbers and use \"Direct Others to Page\" (para 37). Orders and endorsements are released in the Orders and Endorsements bundle (para 39)."]}]},{"title":"Provincial – Presumptive Mode of Appearance","blocks":[{"t":"p","text":"Unless the court orders otherwise, the presumptive modes for civil events are (para 57) — some northern regions have more flexibility:"},{"t":"table","headers":["Event","Presumptive mode"],"rows":[["Case conferences","Virtual"],["Pre-trial conferences (scheduling, settlement, trial management)","Virtual"],["Trial and long-motion scheduling courts","Virtual"],["Consent, without notice and unopposed motions","In writing"],["Contested short motions","Virtual, unless a party asks for in person and the court agrees (or the region directs otherwise)"],["Contested long motions and applications","In person, unless a party asks for virtual and the court agrees"],["Judge-alone trials","In person (virtual only if all parties consent and the court approves)"],["Jury trials","In person"],["Assessment hearings","Virtual"],["Motions for costs","In writing"]]},{"t":"p","text":"To change the mode under **Rule 1.08**, propose it in the notice of motion (Form 37A lists the choices). A party objecting delivers a **Notice of Objection (Form 1A)** before the earlier of 10 days after service of the proposal or 7 days before the hearing; the court then holds a telephone case conference (Toronto PD D.5). Virtual etiquette: test your connection, mute when not speaking, never record (s. 136 Courts of Justice Act) (paras 58–63)."}]},{"title":"Provincial – Factums, Authorities and Compendiums","blocks":[{"t":"ul","items":["Factums are **required on long motions** and encouraged on others; maximum **20 pages** unless leave is granted (paras 41–42). Service and filing times are the same as other motion materials unless a regional PD says otherwise.","Hyperlink every authority to a free public source (e.g. CanLII), with a **paragraph pinpoint** for each citation and neutral citations where available (paras 93–94).","**Certification of authorities (r. 4.06.1(2.1)):** every factum must include a statement signed by the lawyer (or someone they authorized) that they are satisfied as to the **authenticity of every authority cited**. Authorities from government sites, CanLII, court sites or commercial publishers are presumed authentic (r. 4.06.1(2.2)). Expert reports carry a similar verification duty (r. 53.03).","If every authority is hyperlinked, **no book of authorities** is needed (para 95). Otherwise, file an abbreviated PDF book with a hyperlinked table of contents containing only non-public material (unreported decisions, textbook excerpts, Quicklaw/Westlaw-only decisions) and, in civil matters, **only the excerpts cited** (paras 96–98). Note the date a database decision was obtained (para 99).","**Compendium (r. 4.05.3(3)):** fair extracts of documents, transcripts and prior orders you will refer to, with a hyperlinked table of contents and Case Center page references (para 28).","Argue everything orally — \"It is not sufficient merely to upload materials to Case Center.\" Material not raised at the hearing may not be considered (paras 90–91)."]}]},{"title":"Provincial – Time Estimates and Hearing Dates","blocks":[{"t":"ul","items":["Give accurate estimates, considering the number of issues, the pace of reviewing documents and authorities, and how many authorities you really need (para 85). Bad estimates can lead to an adjournment with no expedited new date and costs (para 86).","A date set by the court is expected to proceed (para 87). Agreeing to a date commits counsel and parties to it, and conflicting commitments must be disclosed when agreeing (paras 88–89)."]}]},{"title":"Provincial – Transfers Between Counties (r. 13.1.02)","blocks":[{"t":"ol","items":["Party motions to transfer are heard by the **Regional Senior Judge** (or designate). A judge or associate judge can also transfer on their own initiative at a case conference (r. 13.1.02(4)) (para 43).","Bring the motion **in writing** at the court location **to which** you want the case transferred (paras 44, 47). Consent alone is not enough — show transfer is in the interest of justice under the r. 13.1.02(2)(b) factors (para 45).","Supporting affidavit must address: the r. 13.1.02(2)(b) factors; the stage of the case (further motions, pre-trial held or scheduled, mediation held); why it was started in the original county; estimated trial length, jury or not, and the number of counsel and parties (para 47). You need not prove judge availability in the other county (para 48).","Responding parties should rely on written submissions; if an oral hearing is needed, request a r. 50.13 case conference (para 49). Transfers cannot go to a foreign country (para 46)."]}]},{"title":"Provincial – Simplified Procedure (Rule 76)","blocks":[{"t":"p","text":"Use the court's [Trial Management Plan form](https://www.ontariocourts.ca/scj/files/forms/trial-management-plan-EN.docx) in every Rule 76 case and file it **at least 5 days before the pre-trial conference** (rr. 76.10(2), (4); para 64)."}]},{"title":"Provincial – Publication Bans and Court Records","blocks":[{"t":"ul","items":["For a **discretionary publication ban**: serve and file a notice of motion or application, and give media notice through the [publication ban notification system](https://www.publicationban.scj-csj.ca/pubban_request.php) within the usual notice period for motions (paras 112–115).","No transcripts of case management, settlement or trial management conferences are available without a judge's order (para 108); in camera portions are not publicly accessible (para 109)."]}]},{"title":"Provincial – Class Actions","blocks":[{"t":"ol","items":["Title the proceeding \"**Proceeding under the Class Proceedings Act, 1992**\" and add \"**CP**\" to the court file number (paras 76–77).","Before the first attendance, post the pleadings on the **CBA National Class Action Database**: complete the [registration form](https://www.cba.org/getmedia/96a9d849-4d21-4f37-ad49-f1079c55c2b4/ClassActionForm2019.docx) and email it with the pleadings and certification motion to classaction@cba.org; confirm at the first attendance that you did (para 69).","Follow the CBA Judicial Protocol for multi-jurisdictional class actions and the [Best Practice Guide for Class Actions](https://www.ontariocourts.ca/scj/areas-of-law/civil-court/best-practices-guide-for-class-actions-in-ontario/) (paras 67–68). Tell the court at every attendance about related actions, and circulate a notification list of all counsel and judges in related actions before the first case management conference (paras 71–72).","Each region has designated **Class Proceedings Judges**; get their names from the Regional Manager: NW (807) 343-2727 · NE (705) 564-7813 · East (613) 239-1385 · CE (905) 853-4822 · Toronto (416) 327-6104 · CW (905) 456-4838 · CS (905) 645-5323 · SW (519) 660-2285 (para 75).","Draft orders must be **blacklined against the model orders**: [discontinuance](https://www.ontariocourts.ca/scj/files/forms/class-actions/discontinuance-EN.docx), [carriage](https://www.ontariocourts.ca/scj/files/forms/class-actions/carriage-EN.docx), [certification](https://www.ontariocourts.ca/scj/files/forms/class-actions/certification-EN.docx), [notice/consent certification](https://www.ontariocourts.ca/scj/files/forms/class-actions/consent-EN.docx), [settlement approval](https://www.ontariocourts.ca/scj/files/forms/class-actions/settlement-EN.docx), [fee approval](https://www.ontariocourts.ca/scj/files/forms/class-actions/fee-approval-EN.docx), [litigation funding](https://www.ontariocourts.ca/scj/files/forms/class-actions/litigation-funding-EN.docx) (para 79).","Costs on pre-trial motions: exchange and bring a Form 57B costs outline (max 3 pages) showing hours, rates sought and actual rates; consult on costs beforehand (para 80)."]}]},{"title":"Provincial – Estate Certificates by Email","blocks":[{"t":"p","text":"Probate (Certificate of Appointment of Estate Trustee, Small Estate Certificate) applications may be emailed to the courthouse address on the court's list, with the Information Form; subject line like *\"SCJ – ESTATES – new file – Application for Certificate of Appointment of Estate Trustee\"*; max **35 pages** per email; one PDF per form; originals (wills, bonds) and estate administration tax go by mail, courier or in person (paras 81–83). Estate **litigation** is filed through Civil Submissions Online like any civil case (para 84)."}]},{"title":"Provincial – Attire and Courtroom","blocks":[{"t":"p","text":"Counsel may modify court attire for personal circumstances (pregnancy, medical condition, disability) if dark and consistent with decorum — tell the registrar before court opens (paras 103–104). Address judges as \"Your Honour\" / \"Votre Honneur\" (para 105)."}]}],"toronto":[{"title":"PART II — REGIONAL CHAPTERS","blocks":[{"t":"p","text":"Each chapter below follows the same order: **At a Glance**, **Short Motions**, **Long Motions**, **Short Applications**, **Long Applications**, **In Writing / Consent / Without Notice**, **Urgent Matters**, **Confirmation**, **Materials & Case Center**, **Adjournments** and **Contacts**. Each step tells you **what** to prepare, **where** to send it (portal, email address and subject line), **what to attach**, **what the parties must agree to**, and **by when**. Paragraph references (e.g. \"PD para. 41\") are to that region's Practice Direction."},{"t":"note","label":"Where a Practice Direction is silent:","items":["Some Practice Directions do not say exactly how a step is done (for example, which email address to use). Where that happens, this guide says so and tells you the safest practical method, marked **\"Practice tip\"**. Confirm practice tips with the local Trial Coordinator the first time you use them."]}],"h1":true},{"title":"Chapter 1 — Toronto Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Toronto Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-toronto-region/) (effective October 14, 2025)"],["Courthouses (Civil)","330 University Avenue; 393 University Avenue"],["Filing Portal","[Ontario Courts Public Portal](https://courts.ontario.ca/) (Toronto only). Every Toronto form below is submitted through the Portal."],["Short vs. Long","**Two hours or less** for all parties to argue = Short. More than two hours = Long. Summary Judgment is always Long."],["Booking","[Toronto Calendly](https://calendly.com/toronto-region) (Associate Judge short motions, case conferences, Civil Practice Court) + the matching request form through the Portal"],["Confirmation","Judge: [Civil Motion Confirmation Form](https://www.ontariocourts.ca/scj/files/forms/civ/confirmation-EN.doc) through the Portal **and** emailed to all parties by **2:00 p.m., 10 business days** before. Associate Judge: through the Portal **5 days** before (excluding weekends/holidays)."]]}],"h1":true},{"title":"Toronto – Short Motions Before an Associate Judge","blocks":[{"t":"p","text":"Short Motions before an Associate Judge in Toronto are motions requiring **two hours or less** for all parties to argue (PD para. 41). Opposed short motions are booked as follows:"},{"t":"ol","items":["**Confer first.** Email all affected responding parties proposing two or three dates and the time estimate. Agree on (a) the date, (b) the total time for all parties, and (c) one method of hearing (in person **or** remote) (PD para. 41.3). Keep the email chain; you will need it if the date is not on consent.","**Book on Calendly.** Go to [Toronto Calendly](https://calendly.com/toronto-region), choose the Associate Judge short motion calendar with the correct length of time,{{FOR MOTIONS: You must select the appropriate length of time.}} and answer the questions. If the other side would not agree to a date despite best efforts, answer that the date is **not on consent** and tell all parties which date you selected.","**Forward the confirmation.** Calendly emails you a confirmation (from notifications@calendly.com) setting out the next steps. Forward that email, and every later Calendly email, to all parties in the action.","**Secure the date.** Complete the [Short Motion or Application Request Form](https://www.ontariocourts.ca/scj/files/forms/civ/shortmotion-EN.docx) and submit it, together with a PDF of the Calendly confirmation email, through the **[Ontario Courts Public Portal](https://courts.ontario.ca/)**.{{Toronto uses the Ontario Courts Public Portal. All other regions currently use the Justice Services Online portal.}} ***NOTE: THIS MUST BE DONE WITHIN 5 DAYS OF BOOKING YOUR MOTION ON CALENDLY.***","**File the Notice of Motion and pay the fee** through the Portal within **10 business days** of requisitioning the date, or the date is vacated (PD para. 34). The Notice of Motion must show the booked date, time and method of hearing.","**Serve and file** the Motion Record, responding/reply material and factums within the Rules timelines, then upload to Case Center (see Part I, Step 3).","**Confirm** by submitting the [Civil Motion Confirmation Form](https://www.ontariocourts.ca/scj/files/forms/civ/confirmation-EN.doc) through the Portal **5 days** before the hearing, excluding weekends and holidays (PD para. 41.4)."]},{"t":"note","label":"Express Court (15 minutes or less):","items":["Unopposed short motions that do not qualify as in-writing motions and need **no more than 15 minutes** may be scheduled in Express Court (PD para. 41.1). The time limit is strictly enforced.","**Practice tip:** the Practice Direction does not describe a separate booking route. Look for the Express Court option on [Toronto Calendly](https://calendly.com/toronto-region) and follow steps 3–7 above. If no Express option appears, email JUS.G.MAG.CSD.Civilmotionsscheduling@ontario.ca to ask how to book it."]},{"t":"note","label":"Lawyer Removal Motions:","items":["Book through [Toronto Calendly](https://calendly.com/toronto-region) as an opposed short motion by videoconference. The Civil Scheduling Unit replies with the date and the Zoom coordinates, which you **must copy into the Notice of Motion** served on the client and the other parties. Do not file the unredacted motion record through the Portal; email it to the registrar at the start of the hearing as the Associate Judge directs (PD para. 41.5)."]}]},{"title":"Toronto – Short Motions Before a Judge","blocks":[{"t":"p","text":"Short Motions before a Judge in Toronto are **two hours or less** for all parties to argue (PD para. 27). There is no Calendly booking for these. Instead:"},{"t":"ol","items":["**Consult** (or attempt to consult) every affected responding party about the motion, the time estimate and their availability. Record their position (opposed, unopposed, consent, no response).","**Complete the [Short Motion or Application Request Form](https://www.ontariocourts.ca/scj/files/forms/civ/shortmotion-EN.docx).** Set out the relief, the time estimate for all parties, each party's position and proposed dates. If you are asking for the motion to be heard in writing because the other side has not responded, say so on the form (PD para. 25).","**Submit the form through the [Ontario Courts Public Portal](https://courts.ontario.ca/).**","**Wait for the Court.** Opposed short motions are reviewed in writing by a Judge before being scheduled. The Judge may (a) fix the method of hearing, (b) give directions for disposing of the motion, or (c) direct a **case conference** first (PD paras. 27, 29). The Court's response comes by email; for scheduling questions, write to Civiljudgesmotions@ontario.ca.","If a case conference is directed, book it on [Toronto Calendly](https://calendly.com/toronto-region) and submit the [Case Conference Request Form](https://ontariocourts.ca/scj/files/forms/to/CivilCaseConferenceRequestForm-EN.docx) through the Portal (PD para. 26). At the conference, the Judge may fix the hearing date and a timetable.","Once a date is assigned, **file the Notice of Motion with the fee within 10 business days** of the requisition or the date is vacated (PD para. 34).","Serve, file and upload materials, then confirm by **2:00 p.m., 10 business days** before the hearing (see Confirmation below)."]}]},{"title":"Toronto – Long Motions Before a Judge (incl. Summary Judgment)","blocks":[{"t":"p","text":"All Summary Judgment Motions, Long Motions, Long Applications, appeals from the Consent and Capacity Board and urgent matters are scheduled through **Civil Practice Court (\"CPC\")** (PD para. 30). CPC sits every **Tuesday and Wednesday at 9:30 a.m. by Zoom**. Gowns are not required. You will attend CPC **twice**: the first time to have a timetable approved, the second time to receive the hearing date."},{"t":"h3","text":"First CPC Attendance – Timetable"},{"t":"ol","items":["**Draft a timetable.** Using the [Timetable form](https://www.ontariocourts.ca/scj/files/forms/civ/timetable-EN.doc), propose dates for every remaining step: responding record, reply record, cross-examinations, answers to undertakings, refusals motion (if any), moving party's factum, responding factum and reply factum. Circulate it to all parties and seek their agreement in writing.","**Agree on a CPC date** with all parties, then book it on [Toronto Calendly](https://calendly.com/toronto-region) (CPC calendar). If no date can be agreed, say so in the Calendly questions and tell all parties the date you chose.","**Forward** the Calendly confirmation email to all parties.","**Secure the date.** Complete the [Requisition to Attend Civil Practice Court](https://ontariocourts.ca/scj/files/forms/civ/cpc-req-attend-EN.docx){{If this link stops working, use ACL or a past precedent. The form has historically been difficult to locate on the Court's website.}} and submit it, with a PDF of the Calendly confirmation, through the **[Ontario Courts Public Portal](https://courts.ontario.ca/)**.","If the Notice of Motion has not yet been filed, file it with the fee within **10 business days** of requisitioning the date (PD para. 34).","**Attend CPC** (by Zoom) with a copy of the agreed (or proposed) timetable. The CPC Judge approves it and incorporates it into an **endorsement**. Diarize every date in the endorsement."]},{"t":"h3","text":"Second CPC Attendance – Hearing Date"},{"t":"ol","items":["Complete **every** step in the timetable, including the exchange of factums. A hearing date is only given once all steps are done (PD para. 30).","Book the second CPC attendance the same way: agree on a date, book on [Toronto Calendly](https://calendly.com/toronto-region), forward the confirmation, and submit a fresh [Requisition to Attend Civil Practice Court](https://ontariocourts.ca/scj/files/forms/civ/cpc-req-attend-EN.docx) with the Calendly PDF through the Portal.","At the second attendance the Judge assigns the hearing date. Diarize the hearing date, the 30-day status email and the 10-business-day confirmation deadline immediately."]},{"t":"h3","text":"Before the Hearing"},{"t":"ol","items":["**30 calendar days before the hearing:** email **LongMotionsStatus.Judge@ontario.ca**, copying all parties, confirming the status of the motion (PD para. 31). Include the court file number, short title, hearing date, the nature of the motion, whether all steps are complete and whether it is ready to proceed.","**About one week before:** the Court usually contacts the parties to ask about readiness and whether oral evidence is needed. Reply promptly.","**By 2:00 p.m., 10 business days before:** submit the [Civil Motion Confirmation Form](https://www.ontariocourts.ca/scj/files/forms/civ/confirmation-EN.doc) through the Portal and email it to all parties, **together with a list of the names, telephone numbers and email addresses** of counsel for all parties and non-parties and of any self-represented party (PD para. 31)."]},{"t":"note","label":"NOTE:","items":["Summary Judgment Motions are Long Motions in Toronto and must go through CPC regardless of the time counsel estimates. In other regions, CPC is replaced by **Triage Court**, which serves a similar purpose."]}]},{"title":"Toronto – Long Motions Before an Associate Judge","blocks":[{"t":"ol","items":["Complete the [Long Motion Request Form](https://www.ontariocourts.ca/scj/files/forms/civ/longmotion-EN.doc) (motions requiring **more than two hours** for all parties).","Email it to **associatejudges.longmotions@ontario.ca**, copying all parties. In a **case-managed** action, send it instead to the Assistant Trial Coordinator for the Associate Judge managing the action (PD para. 42.1).","The assigned Associate Judge convenes a **case conference** and sets the filing schedule and hearing date. Follow the endorsement.","Confirm through the Portal **5 days** before the hearing (excluding weekends and holidays)."]}]},{"title":"Toronto – Short Applications","blocks":[{"t":"ol","items":["Issue the Notice of Application (Form 14E) through the [Ontario Courts Public Portal](https://courts.ontario.ca/) and pay the fee.","Consult the respondents, then submit the [Short Motion or Application Request Form](https://www.ontariocourts.ca/scj/files/forms/civ/shortmotion-EN.docx) through the Portal (it is the same form used for short motions) (PD para. 27).","Await the Judge's review and directions (date, written hearing or case conference).","The Application must be **issued within 10 business days** of requisitioning the date or the date is vacated (PD para. 34).","Serve the Notice of Application at least 10 days before the hearing, file the Application Record and factums, and confirm by **2:00 p.m., 10 business days** before."]}]},{"title":"Toronto – Long Applications","blocks":[{"t":"p","text":"Long Applications follow exactly the same two-attendance **CPC** process as Long Motions above: timetable at the first CPC attendance, hearing date at the second, 30-day status email to LongMotionsStatus.Judge@ontario.ca, and confirmation with the counsel list by 2:00 p.m., 10 business days before."}]},{"title":"Toronto – In Writing, Consent and Without Notice","blocks":[{"t":"ul","items":["**Before a Judge (PD para. 25):** motions and applications made **without notice**, **on consent of all parties**, or **confirmed as unopposed** (meaning you have written confirmation from the other side that they do not oppose) are heard **in writing**. File the record as a **searchable PDF** through the Portal with the [Short Motion or Application Request Form](https://www.ontariocourts.ca/scj/files/forms/civ/shortmotion-EN.docx), and include the draft order in PDF and Word. If you do not have written confirmation, proceed as an opposed short motion and explain on the request form that the other side has not responded.","**Before an Associate Judge (PD para. 40):** file the in-writing motion as a searchable PDF through the Portal and include a **separate document listing every party, their counsel and their position** on the motion.","**Rule 7 (parties under disability) approvals (PD para. 33):** file the record as searchable PDF through the Portal, including everything r. 7.08(4) requires. If sealing or redaction is sought, file the **redacted** version through the Portal and **email the unredacted** version to LongMotionsStatus.Judge@ontario.ca stating that a sealing/redaction order is requested; never upload the unredacted version to Case Center. Upload the approved draft judgment in Word to Case Center as a separate document. Follow the [Best Practices Guidelines and Checklist](https://www.ontariocourts.ca/scj/filing-procedures/regional/best-practices-guidelines-and-checklist/)."]}]},{"title":"Toronto – Urgent Matters","blocks":[{"t":"ol","items":["Complete the [Urgent Motion Request Form](https://ontariocourts.ca/scj/files/forms/civ/Urgent-Motion-Request-to-a-Judge-or-Associate-Judge.pdf).","Submit it through the [Ontario Courts Public Portal](https://courts.ontario.ca/) and **flag the filing as time sensitive** (a filing is time sensitive if the hearing is three or fewer business days away).","Immediately email **Civilurgentmatters-SCJ-Toronto@ontario.ca** (Judge) or **JUS.G.MAG.CSD.Civilmotionsscheduling@ontario.ca** (Associate Judge) advising that an urgent request has been submitted to the Portal, with the court file number and short title (PD paras. 32, 41.2)."]}]},{"title":"Toronto – Confirmation of Motion","blocks":[{"t":"p","text":"Complete the [Civil Motion Confirmation Form](https://www.ontariocourts.ca/scj/files/forms/civ/confirmation-EN.doc) (see Part I, Step 4 for how to fill it out). It must be **submitted through the [Ontario Courts Public Portal](https://courts.ontario.ca/)** and **emailed to all parties**."},{"t":"table","headers":["Hearing Before","Deadline","What to Include / Notes"],"rows":[["Judge (Short Motion / Application)","**2:00 p.m., 10 business days** before the hearing (PD para. 28)","Abandoned motion where the responding party seeks costs: submit by **10:00 a.m., 4 business days** before."],["Judge (Long Motion / Summary Judgment / Long Application)","**2:00 p.m., 10 business days** before the hearing (PD para. 31)","Attach a **list of the names, telephone numbers and emails** of counsel for all parties and non-parties, and of self-represented parties. Also send the 30-day status email."],["Associate Judge","**5 days** before the hearing, excluding weekends and holidays (PD para. 41.4)","Abandoned motion with costs claim: **10:00 a.m., 4 clear days** before."]]},{"t":"note","label":"DIARIZE IT:","items":["Toronto requires confirmation **twice as early** as the Rules (10 business days instead of 5). Diarize the deadline with reminders the day you book."]}]},{"title":"Toronto – Materials & Case Center","blocks":[{"t":"ul","items":["Court staff upload each document you file through the Portal to Case Center. **You** must still upload your compendium and any material proposed as an exhibit, and review the bundle **24 hours before** the hearing.","Factums before a Judge: maximum **20 pages** unless leave is obtained at CPC (PD para. 38). Provide factums and draft orders in Word as well.","Each Portal filing may not exceed **500 pages**; split larger records into volumes.","If you cannot reach the Portal from within North America, email Toronto.scj.civilintake@ontario.ca."]}]},{"title":"Toronto – Adjournments","blocks":[{"t":"ul","items":["No adjournment of any motion before a Judge or Associate Judge will be granted within **2 days** of the hearing, except in extenuating and exceptional circumstances (PD para. 21).","A CPC-approved timetable may not be varied without a court order. To change it, book a further CPC attendance (Calendly + Requisition through the Portal) before the deadline passes.","If the motion is settled or adjourned on consent, tell the Court immediately and submit a revised confirmation showing the new status."]}]},{"title":"Toronto – Filing and the Ontario Courts Public Portal","blocks":[{"t":"ul","items":["Since **October 14, 2025** every Toronto civil filing (including Commercial List, Bankruptcy, Small Claims, Divisional Court and Enforcement) goes through the [Ontario Courts Public Portal](https://courts.ontario.ca/), which replaced JSO in Toronto (PD Part B paras 1–3). You need a new Portal account the first time — see the [Portal user guide](https://www.ontariocourts.ca/scj/toronto-courts-digital-transformation/).","All Toronto confirmation and scheduling forms are submitted through the Portal (para B-5). A document is filed on the date in the registrar's acceptance confirmation (D.1 para 3).","**Time sensitive:** tick the \"time sensitive\" option only when the hearing or deadline is **three business days or fewer** away, and also email the trial coordination office (para B-6).","Maximum **500 pages** per Portal document (para B-7). Factums and draft orders also go in **Word** (D.1 para 19).","The Portal only works from within North America. If you cannot use it (e.g. filing from abroad), email: Civil – Toronto.scj.civilintake@ontario.ca; Commercial – Toronto.commercial.filings@ontario.ca; Bankruptcy – Toronto.bankruptcy.filings@ontario.ca; Estates – Toronto.estates.filings@ontario.ca; Divisional Court – DivCourtSchedule@ontario.ca (para B-11).","Counter or email filing is otherwise only for sealed documents (or a sealing motion) or an accessibility/technology barrier (D.1 para 6). Keep signed originals if you email (para 7).","Help: CourtsPortal@ontario.ca · 647-438-0403 · 1-800-980-4962 · TTY 416-368-4202 (para B-12)."]}]},{"title":"Toronto – Case Center","blocks":[{"t":"ul","items":["In Toronto, **court staff** upload every accepted Portal filing to Case Center once — you do not re-upload filed materials (para B-4).","You still upload your **compendium** and anything you propose to tender as an **exhibit**, and you must never delete an upload (para B-9).","Review the hearing bundle **24 hours before** the hearing (para B-8). The moving party sends the Case Center invitation and the Zoom link to all responding parties and known stakeholders as soon as they are available (D.1 para 17).","Pre-trial briefs and draft r. 50.08 reports are uploaded **directly to Case Center** (pre-trial folder) — not through the Portal and not by email (D.4)."]}]},{"title":"Toronto – Mode of Appearance","blocks":[{"t":"ul","items":["Toronto follows the provincial presumptive modes (see Province-Wide Rules). CPC, To Be Spoken To Court and Long Trial Scheduling Court sit by Zoom. Pre-trials are presumptively remote (D.4).","To propose a different mode, state it in your notice of motion or form (Form 37A lists the choices) under r. 1.08(1). An opposing party delivers a **Notice of Objection (Form 1A)** before the earlier of 10 days after service and 7 days before the hearing; the court then holds a telephone case conference (r. 1.08(4)–(5); D.5).","For discoveries, cross-examinations and r. 24.1 mediations, agree on the format; if you cannot, request a r. 50.13 case conference (D.5)."]}]},{"title":"Toronto – Associate Judge Rules (References, 48.14, Lists)","blocks":[{"t":"ul","items":["**Jurisdiction:** an Associate Judge hears any civil motion except those in r. 37.02(2). Unless the relief is reserved to a judge, a motion must be made to \"the Court\" and is heard by an Associate Judge (D.3).","**Placeholder rule:** an Associate Judge short-motion date is vacated if the Notice of Motion and fee are not filed within **10 business days** of requisitioning it (D.3).","**Case conferences before an Associate Judge (r. 50.13):** email the Case Conference Request form to **TorontoCaseConferenceAppointments@ontario.ca** (D.3).","**References:** email the Requisition Form with a copy of the entered judgment to **associatejudges.longmotions@ontario.ca**; the assigned Associate Judge's Assistant Trial Coordinator arranges a case conference to schedule the motion for directions and the reference hearing (D.3).","**Urgent hearings before an Associate Judge** may be sent to **Civilurgentmatters-SCJ-Toronto@ontario.ca** with the Urgent Motion Request form (D.3).","**Simplified Procedure discovery motions** are capped at **60 minutes** in total; use r. 34.12 to answer questions under objection (D.3).","**Class Proceedings, Commercial List and Estates List** motions (or actions assigned under rr. 37.15 / 77.06) need a **written direction from a judge** before an Associate Judge can hear them — except BIA matters heard by an Associate Judge as Registrar in Bankruptcy (D.3)."]}]},{"title":"Toronto – Administrative Dismissals (Rule 48.14)","blocks":[{"t":"ul","items":["**Consent or confirmed unopposed** motions on the r. 48.14 dismissal timelines: bring a **motion in writing before an Associate Judge** (searchable PDF through the Portal) (D.3 para 43(i)).","**Contested status hearings:** schedule as a **long motion before an Associate Judge** — email the Long Motion Request Form to associatejudges.longmotions@ontario.ca (D.3 para 43(ii), 42)."]}]},{"title":"Toronto – Case Conferences and Case Management","blocks":[{"t":"ol","items":["**Before a Judge:** agree on a date, book it on [Toronto Calendly](https://calendly.com/toronto-region), forward the Calendly emails to all parties, and submit the [Case Conference Request form](https://ontariocourts.ca/scj/files/forms/to/CivilCaseConferenceRequestForm-EN.docx) (r. 50.13(1)) through the Portal (D.2 para 26). If no date can be agreed, say so in Calendly and tell the other parties.","**Before an Associate Judge:** email the Case Conference Request form to TorontoCaseConferenceAppointments@ontario.ca (D.3).","**Case management (Rule 77):** submit the [Request for Case Management form](https://www.ontariocourts.ca/scj/files/forms/civ/request-EN.doc) through the Portal **and** email a copy to **scj-rsjoffice@ontario.ca**. Consent alone is not enough — explain why under the r. 77.05(4) criteria. Requests for one judge to hear all motions (rr. 37.15, 77.06) go in writing to the RSJ (D.2 para 36)."]},{"t":"note","label":"Construction Act cases:","items":["Rule 50 (including r. 50.13 case conferences) does not apply to actions governed by the Construction Act (O. Reg. 302/18, s. 10(9)). See Construction Liens below."]}]},{"title":"Toronto – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Pre-trials are held for cases with **fixed trial dates** and are presumptively **remote**; you are told the location the week before (D.4). Attend with full authority to settle and no outstanding expert reports or key productions.","**At least 30 days before:** each party completes a **Certificate of Readiness (Form 50A)** on the status of expert reports and submits it through the Portal (r. 50.03).","You receive a blank **r. 50.08 pre-trial report**. Trial counsel complete it together as far as possible and return it to the trial coordinator **in Word** before the pre-trial; failure can mean the pre-trial is rescheduled.","**At least 5 days before:** serve and upload to Case Center (pre-trial event folder) each party's **brief** (concise position and the evidence relied on at trial) and the draft r. 50.08 report. Do **not** file briefs through the Portal or email them.","**Rule 76 actions:** the documents required by r. 76.10(2) and (4) are served and uploaded **5 clear days** before the pre-trial.","Summarize treatment and expert opinions; link a report through a secure external viewer if the judge should read it. Do not send voluminous records (clinical notes, tax returns, employment files) by link or Dropbox — chart them in the brief.","Need a different pre-trial date? Book a case conference before a judge through [Toronto Calendly](https://calendly.com/toronto-region) and submit the Case Conference Request form through the Portal."]}]},{"title":"Toronto – Trial Scheduling and Trials","blocks":[{"t":"ol","items":["**File the trial record first** — you cannot book a trial scheduling appearance until you have (D.2 para 22). Court staff will not accept a trial record without the **mandatory mediation Certificate** (see Mediation).","Trials of **10 days or fewer:** **To Be Spoken To Court** — Mondays 9:00 a.m. by Zoom. Trials of **more than 10 days:** **Long Trial Scheduling Court** — Wednesdays 9:00 a.m. by Zoom. Book both on [Toronto Calendly](https://calendly.com/toronto-region) and forward all Calendly emails to the other parties.","Before attending, confer and complete the [Trial Timetable form](https://www.ontariocourts.ca/scj/files/forms/Trial-timetable_EN.docx). It is finalized at Trial Scheduling Court and **cannot be varied without a court order** (para 23)."]}]},{"title":"Toronto – Mandatory Mediation (Rule 24.1)","blocks":[{"t":"ul","items":["Applies to **all actions commenced in or transferred to Toronto** except those excluded by rr. 24.1.04(2) and (2.1) — Commercial List cases are excluded (D.2 para 37; G.17).","The mediation must take place within **180 days after the first defence is filed**, unless a consent under r. 24.1.09(3) is filed or the court orders otherwise.","You **cannot file a trial record** (or a Simplified Procedure notice of readiness) without a [Certificate](https://www.ontariocourts.ca/scj/files/forms/civ/certificate-EN.doc) stating that: (a) Form 24.1A was filed and the session took place; (b) the mediator's report was filed; (c) an order exempts the action; or (d) an order extends the deadline past set-down.","Exemption motions go to any Associate Judge (in writing on consent with good reasons, or in motions court). A judge may order that no further steps be taken until mediation happens (r. 1.05)."]}]},{"title":"Toronto – Transfers","blocks":[{"t":"p","text":"Transfer motions follow Part 1 of the Consolidated Civil Provincial PD (in writing, at the receiving location; see Province-Wide Rules – Transfers) (D.2 para 35). Transferred actions become subject to Toronto mandatory mediation. Construction lien transfers into Toronto go to the RSJ and must include evidence on all other liens and lien claimants' positions (J, Section 1)."}]},{"title":"Toronto – Costs","blocks":[{"t":"ul","items":["Serve and bring a **costs outline (Form 57B)**, max **3 pages** (r. 57.01(6)); for motion costs, also file it through the Portal (D.1 para 18).","Abandoned motion where the responding party wants costs: confirmation by **10:00 a.m., 4 business days** before (Judge) or **4 clear days** (Associate Judge)."]}]},{"title":"Toronto – Sealing and Confidential Material","blocks":[{"t":"ul","items":["Sealed documents (or those supporting a sealing motion) may be filed in person or by email (D.1 para 6).","Rule 7 approvals with sealing/redaction: file the **redacted** version through the Portal and **email the unredacted** version to LongMotionsStatus.Judge@ontario.ca stating that a sealing/redaction order is requested; never upload unredacted material to Case Center (D.2 para 33).","Unredacted records on a motion to get off the record (r. 15.04(1.3)) are not filed through the Portal; email them to the registrar at the start of the hearing (D.3 para 41.5)."]}]},{"title":"Toronto – Construction Liens","blocks":[{"t":"h3","text":"Before a Judge (Section 1)"},{"t":"p","text":"Trials not referred to an Associate Judge; motions for a **judgment of reference** (Construction Act s. 58(1)); transfers of lien actions into Toronto (to the RSJ); and motions outside an Associate Judge's jurisdiction — explain why it must go to a judge."},{"t":"h3","text":"Before a Construction Lien Associate Judge (Section 2)"},{"t":"ol","items":["**Short motions (2 hours or less):** confer with all affected parties, reserve a date on [Toronto Calendly](https://calendly.com/toronto-region) (if an Associate Judge is already seized, confirm their sittin
