g days with their Assistant Trial Coordinator or **Toronto.AssociateJudges.ConstructionLienMatters@ontario.ca** first), then submit the **Construction Lien Motion Request Form** with the Calendly confirmation through the Portal. The date is not guaranteed until the court confirms it.","**Long motions (over 2 hours):** submit the Construction Lien Motion Request Form with proposed dates through the Portal; a case conference sets the timetable and return date. Name any seized Associate Judge on the form and in the notice of motion.","**Urgent:** flag the request form and the Portal filing as time sensitive and email Toronto.AssociateJudges.ConstructionLienMatters@ontario.ca.","**Ex parte court** (without notice, consent, or confirmed unopposed motions — e.g. vacating a lien by payment into court): may be brought in writing. File bookmarked, searchable PDFs through the Portal in the existing lien action (or leave the file number blank for a new general file). Non-Toronto actions seeking leave to be heard in Toronto are filed by email only.","**Vacating a lien (s. 44):** include a clear copy of the security, a completed **fiat**, a draft order in the Toronto standard form (PDF and Word) and separate copies of the security and fiat; for lien bonds, show corporate seals and signing authority; for **e-bonds**, include the electronic original and the Accountant's confirmation (ascj-info@ontario.ca). Once signed, issue and enter the order, then take the order, fiat and original security to the Accountant of the Superior Court, serve the vacating order with the Accountant's receipt and register it on title.","**Order for trial:** obtain a reference order from a judge first, then book the first trial management conference on [Toronto Calendly](https://calendly.com/toronto-region) after canvassing all lien claimants. File the motion with all pleadings, status, the reference order and the Calendly confirmation **within 10 days** or the reservation may be cancelled.","**Materials:** searchable PDF, bookmarked or hyperlinked; affidavits, factums and draft orders also in Word; file a **participant sheet** for every hearing."]}]},{"title":"Toronto – Commercial List: Eligibility and Getting On","blocks":[{"t":"ul","items":["Office: **Commercial List Office, 9th Floor, 330 University Ave., Toronto M5G 1R7 · mag.csd.to.scjcom@ontario.ca**. Hearings in the 8th-floor courtrooms; matters of **90 minutes or less** (and scheduling appointments and case conferences) by Zoom; longer matters in person (G.3). Gown for contested or substantive matters, even on Zoom.","**Mandatory** on the Commercial List (Toronto Region): BIA, CCAA, receiverships (and all related motions), Winding-Up and Restructuring Act. **Optional:** Bank Act realizations/priorities, OBCA/CBCA, Limited Partnerships Act, Pension Benefits Acts, PPSA, Securities Act, Credit Unions Act administrations, complex arbitration appeals/enforcement, and other matters the Team Lead directs (G.2).","There must be a **material connection to Toronto** beyond the location of counsel (G.5). Title of proceedings: \"**Ontario Superior Court of Justice – Commercial List**\"; notices state the motion/application will be made \"to a judge presiding over the Commercial List at 330 University Avenue, Toronto\" (G.7).","**Issue** through the Portal (G.4). Non-mandatory matters need approval by **motion in writing** to the Team Lead with all parties' consent and a [New Matter Request Form](https://www.ontariocourts.ca/scj/files/forms/com/Commercial-List-New-Matter-Request-Form.docx). Mandatory matters started on the Civil List can be moved by the Office on consent with a Request Form and [Case Timetable](https://www.ontariocourts.ca/scj/files/forms/com/Commercial-List-Case-Timetable-Form.docx) (G.6)."]}]},{"title":"Toronto – Commercial List: Scheduling, Chambers and Urgent","blocks":[{"t":"ol","items":["Every hearing needs a **Request Form**, fully completed and **signed by all counsel** (or individual signed copies), submitted through the Portal: [Chambers Request Form](https://www.ontariocourts.ca/scj/files/forms/com/Commercial-List-Chambers-Request-Form.docx) for matters already on the List; [New Matter Request Form](https://www.ontariocourts.ca/scj/files/forms/com/Commercial-List-New-Matter-Request-Form.docx) to issue or transfer onto it (G.7). All forms and model orders: [Commercial List forms page](https://www.ontariocourts.ca/scj/commercial-list-forms-and-model-orders/).","State a realistic **time estimate**. If not all parties sign, the first attendance is only a **15-minute scheduling appointment** (G.9).","Initial hearing dates come from the Office or from a judge at a **9:30 a.m. chambers appointment** (Zoom). Bring **three mutually convenient dates**, having checked availability with the Office (G.8).","**Chambers:** scheduling appointments (max 15 minutes) or case conferences (30–60 minutes). Submit the Request Form, a consent (or competing) timetable and an **Aide Memoire of no more than 3 pages** through the Portal (G.10). Settlement conference briefs are uploaded to Case Center by **2:00 p.m. two days** before.","**Trials and summary judgment:** dates only from the **Team Lead** (or designate) at a case conference of at least 30 minutes, with a completed [Trial Hearing Requirements Checklist](https://www.ontariocourts.ca/scj/files/forms/com/Commercial-List-Trial-Hearing-Requirements-Checklist.docx) and draft trial schedule; SJ dates are given only once the record is sufficiently advanced (G.8, G.15).","**Urgent** (e.g. CCAA initial orders and stay extensions, receiverships, plans of arrangement, Mareva/Anton Piller/Norwich orders, approval and vesting orders, urgent contested bankruptcies): mark the Portal filing **time sensitive** and email **mag.csd.to.scjcom@ontario.ca** that an urgent filing was submitted (G.4, G.8). Ex parte matters are rare and must be justified."]}]},{"title":"Toronto – Commercial List: Materials, Adjournments and Costs","blocks":[{"t":"ul","items":["File through the Portal within the Rules or the agreed timetable. The moving party (or court officer) sends the Case Center invitation and Zoom link to all stakeholders and checks the hearing bundle; upload anything from earlier hearings you rely on (G.18).","A **joint compendium** with a hyperlinked index to pinpoint pages is expected. File a **factum** on anything contested (an Aide Memoire on uncontested matters). Facta max **25 pages**; reply facta max **5 pages** (new matters only); Aide Memoires max **3 pages**. Indexes and factum authorities must be hyperlinked; non-CanLII authorities highlighted. Max 500 pages per document; number multiple affidavits by the same person.","Draft orders: blackline against the [model orders](https://www.ontariocourts.ca/scj/commercial-list-forms-and-model-orders/) and provide a clean copy in PDF and Word. Authorities in the [Commercial List Authorities Book](https://www.ontariocourts.ca/scj/commercial-list-authorities-book/) need not be reproduced (G.25).","**Sealing:** serve and file redacted materials normally; send confidential appendices to the judge through mag.csd.to.scjcom@ontario.ca (or as directed), not Case Center; expect to deliver a sealed hard copy marked \"Confidential and not to form part of the public Record…\" (G.18).","**Adjournments:** a \"court of non-adjournment\" — only for special circumstances. Consent requests go to **mag.csd.to.scjcom@ontario.ca** (or the next 9:30 a.m. sitting if directed); alert the Office as soon as an adjournment looks likely (G.11).","**Costs** are usually fixed at the end of the hearing: discuss beforehand and file a Costs Outline and/or Bill of Costs through the Portal before the hearing (G.21).","**Case management:** a case conference within **one month** of close of pleadings (or the appointment order), with a discovery plan and Case Timetable (G.13). Mandatory r. 24.1 mediation does **not** apply; pre-trial briefs are delivered at least **5 days** before an intensive pre-trial; trial management conference at least **two months** before trial (G.17).","Associate Judges hear Commercial List motions only on referral from a Commercial List judge (except Registrar in Bankruptcy matters) (G.14)."]}]},{"title":"Toronto – Bankruptcy and Insolvency (Registrars)","blocks":[{"t":"ol","items":["Associate Judges sitting as **Registrars in Bankruptcy** hear matters virtually, in writing, by teleconference or video (in person only exceptionally) (H.1).","Submit a **Toronto Bankruptcy Request Form** through the Portal with the preferred mode, dates, times and a time estimate; over one hour, add a **Special Appointment Request Form**. Forms and draft orders in **Word** (H.1).","**Urgent:** mark time sensitive in the Portal and email **toronto.bankruptcy@ontario.ca** with details.","**Heard in writing (H.2, H.7):** consent/unopposed or compliance-based bankrupt discharges (unless conduct issues or s. 173 facts), trustee discharges, taxations of SRDs with a clear Letter of Comment, legal bill taxations, extensions of proposal periods, unopposed Division I proposals, substituted service, s. 38 motions, re-appointing trustees, amending style of cause, s. 30(4) related-party sales, reviving consumer proposals, and similar.","**Taxation filings** include: the record and a separate PDF of the SRD and dividend sheet for signature; comment letter; trustee's fee affidavit with dockets; inspector resolution; taxed legal bills; one Statement of Affairs; general ledger or trial balance. Leave out duplicates, blank pages, discharge notices and service affidavits for initiating documents.","**Issuing bankruptcy applications:** request issuance through the Portal; file BIA-compliant proof of service; opposed applications are adjourned to a Commercial List judge (H.6). Unsworn affidavits are accepted if sworn before or at the hearing (H.4). Signed orders are delivered electronically (H.5)."]}]},{"title":"Toronto – Class Actions","blocks":[{"t":"ol","items":["Once issued, request assignment to a **Class Action Case Management Judge** by emailing **Toronto.ClassAction@Ontario.ca**; the judge's assistant will contact you (I.1). Follow the provincial class action rules too (CP file number, CBA database, model orders).","Motions (pre-certification, certification, post-certification) may be in writing, by audio/video or in person, as approved at a case management conference. File searchable PDFs through the Portal, then send the Civil Submissions Online confirmation email and the draft order in Word to the judge's assistant (I.2).","Case conferences: email the judge's assistant with available dates and the parties attending (I.3).","**Out-of-town** cases seeking Toronto case management need the Class Actions Team Lead's approval (email Toronto.ClassAction@Ontario.ca), then file through Civil Submissions Online as a \"NEW PROCEEDING\" to get an out-of-town Toronto file number (I.4)."]}]},{"title":"Toronto – Contacts","blocks":[{"t":"table","headers":["Purpose","Contact"],"rows":[["Judges' motions scheduling","Civiljudgesmotions@ontario.ca"],["Associate Judge motions scheduling (incl. urgent)","JUS.G.MAG.CSD.Civilmotionsscheduling@ontario.ca"],["Associate Judge long motions","associatejudges.longmotions@ontario.ca"],["Long motion 30-day status; unredacted Rule 7 materials","LongMotionsStatus.Judge@ontario.ca"],["Urgent matters (Judge)","Civilurgentmatters-SCJ-Toronto@ontario.ca"],["Case management requests","scj-rsjoffice@ontario.ca"],["Email filing (outside North America only)","Toronto.scj.civilintake@ontario.ca"],["Portal help","CourtsPortal@ontario.ca · 1-800-980-4962"]]}]}],"central-east":[{"title":"Chapter 2 — Central East Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Central East Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-east-region/) (effective June 30, 2025; updated July 7, 2026)"],["Courthouses","Barrie, Bracebridge, Cobourg, Lindsay, Newmarket, Oshawa, Peterborough (Orillia and Richmond Hill are Small Claims)"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online) (Civil Submissions Online)"],["Short vs. Long","**One hour or less** = Short. Over one hour (incl. Summary Judgment and all long applications) = \"Long Motion\"."],["Booking","Short: request a regular motions day from the local **Trial Coordinator**. Long: book **Triage Court** on [calendly.com/ce-civil](https://calendly.com/ce-civil)."],["Confirmation","Short: Form 37B/38B **filed through JSO and uploaded to Case Center** (moving party by 2:00 p.m., 5 days before). Long: revised Form 37B/38B **emailed to the Trial Coordinator**, then filed and uploaded, by 2:00 p.m., 5 days before."],["Mode","Contested short motions: virtual. Consent/unopposed: in writing. Long motions: in person."]]}],"h1":true},{"title":"Central East – Short Motions (One Hour or Less)","blocks":[{"t":"p","text":"Short Motions are motions expected to take **one hour or less**, including any cross-motion (PD paras. 43–44). You no longer need a case conference to get a short motion date (PD para. 40). Court opens at **9:30 a.m.** for list vetting; the Judge joins at 10:00 a.m."},{"t":"ol","items":["**Agree on dates with the other side.** Email the responding parties with the relief sought, your time estimate and two or three proposed regular motions days. Get their availability in writing.","**Request the date from the Trial Coordinator.** The Practice Direction requires the motion to be scheduled \"by contacting the Trial Coordinator's Office\" (PD para. 43) but does not prescribe a form. **Practice tip:** email the Trial Coordinator for your courthouse (see Contacts), copying all parties, with the subject line *\"Request for Short Motion Date – [File Name and Number], [Courthouse]\"*, stating: the relief sought, whether it is before a Judge or Associate Judge, the time estimate for all parties, and the agreed dates.","**Prepare the Notice of Motion** returnable on the date the Trial Coordinator gives you, at 9:30 a.m.","**Serve and file** the Notice of Motion, Motion Record and Affidavit of Service through [Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online) within the Rules timelines (PD para. 46).","**Get Case Center access.** Email the local **court filing office** (not the Trial Coordinator) with the court file number, short title, hearing date and the emails of everyone who needs access (PD para. 47).","**Upload** all accepted materials to the Case Center bundle **on or before the time for filing the Confirmation** (PD para. 48).","**Confirm:** file the Confirmation (Form 37B, or 38B for an application) through JSO **and** upload it to Case Center by **2:00 p.m., 5 days** before the hearing (moving party) (PD para. 53)."]},{"t":"note","label":"WARNING:","items":["Five days before the hearing, the Trial Coordinators **remove from the list** any short motion whose materials and Confirmation have not been filed **and** uploaded, and **they will not tell you** (PD paras. 51–52, 59)."]},{"t":"p","text":"The Practice Direction does not separate Judge and Associate Judge short motion days. When you request the date, tell the Trial Coordinator whether the relief is within an Associate Judge's jurisdiction so the motion goes on the correct list."},{"t":"note","label":"Old Case Conference Bookings:","items":["If you previously booked a case conference only to get a short motion date, either (a) cancel it on consent, or (b) convert it to a short motion date on consent, by contacting the Trial Coordinator at least **15 business days** before the conference. Otherwise it proceeds, and each party must file and upload a **one-page, double-spaced, 12-point aide memoire** 7 days before or the conference is cancelled (PD para. 42)."]}]},{"title":"Central East – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Summary Judgment Motions, Long Motions and Applications over one hour are all \"Long Motions\". Every long motion request goes first to **Triage Court**, where the triage Judge decides whether the motion is ready and assigns a hearing date (PD para. 60). Triage Court sits **Tuesdays at 9:00 a.m., virtually only**, in five-minute slots; gowns are not required (PD paras. 142, 150)."},{"t":"h3","text":"A. Getting onto Triage Court"},{"t":"ol","items":["**Agree on the time estimate** for the whole motion with all parties before booking (PD para. 61).","**Book the Triage Court date** on [calendly.com/ce-civil](https://calendly.com/ce-civil). Use the **\"Add Guests\"** feature to add every party's email; if it is not available, forward every Calendly email to all parties yourself (PD paras. 145–147).","**If all parties consent** to the triage attendance: keep the Calendly confirmation email; you will file it with your materials (PD paras. 67–68).","**If any party opposes** the triage attendance: email **CErunninglist@ontario.ca**, copying all parties, with the subject line *\"Request to Schedule long motion – OPPOSED – [File Name and Number], [Originating Court Location]\"*. Attach (a) a letter of request, (b) a memorandum of **no more than two pages** on the history of the case and why it should be added, and (c) the Calendly date and confirmation email. Responding parties have **five days** to send a two-page responding memo to the same address, or the request is treated as unopposed. The triage Judge's decision comes by email (PD para. 70)."]},{"t":"h3","text":"B. Serving, Filing and Timetabling"},{"t":"ol","items":["**Serve and file** the Notice of Motion, supporting affidavits and draft order with the Affidavit of Service through [Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online). **Include a PDF of the Calendly confirmation email** with the filing or the filing office will reject it (PD paras. 64, 88, 90).","**Upload** the materials to Case Center as soon as you receive the Case Center invite (PD para. 89).","**Agree on a written timetable** with all parties for responding materials, reply materials, cross-examinations and factums (PD para. 71). Put it in a short letter or consent signed by all counsel; you will file it with your Confirmation (PD para. 72).","If no timetable is agreed within **30 days**, request a civil case conference by emailing the [Case Conference Request Form](https://www.ontariocourts.ca/scj/files/forms/ce/CE-Civil-Telephone-Case-Conference-Hearing-Request-Form.docx) to **CERcivilappointments@ontario.ca** (PD paras. 73, 105)."]},{"t":"h3","text":"C. Before Triage Court"},{"t":"ol","items":["**At least 14 days before Triage Court:** every document, **including all factums and compendiums**, must be filed and uploaded to Case Center, and cross-examinations must be finished (PD paras. 62–63, 65). If not, the matter is removed from the triage list.","**At least 3 days before Triage Court:** file, then upload to the **Triage Court bundle**, a memorandum of **no more than two pages** setting out the history of the action and the order you want from the triage Judge (PD para. 148).","**Attend Triage Court** by video. The Judge either assigns a fixed hearing date or places the motion on the **running list**. If it is on the running list, you may be called on **two days' notice**, so be ready (PD para. 75).","**Confirm:** by **2:00 p.m., 5 days** before the hearing, email the revised **Form 37B** to the local Trial Coordinator, attach the agreed timetable, then file a copy through JSO and upload it to Case Center (PD paras. 72, 86)."]},{"t":"note","label":"Factums:","items":["A factum is required on every long motion and application; without one, the motion will not be scheduled. Regardless of the timetable, **all factums must be filed and uploaded at least 14 days before the hearing**. Limit: 20 pages. Hyperlink every case and every compendium reference (PD paras. 91–95)."]},{"t":"note","label":"Cancelling Triage:","items":["Triage Court can only be cancelled with the agreement of all parties, using the **\"cancel\"** button in the Calendly email at least **three business days** before (PD paras. 84, 151). A one-sided cancellation is ignored and the attendance proceeds."]},{"t":"p","text":"**Virtual hearing request:** long motions are in person. To ask for a virtual hearing, email the local Trial Coordinator a letter of **no more than two pages** explaining why (PD para. 60)."}]},{"title":"Central East – Short Applications","blocks":[{"t":"ol","items":["Issue the Notice of Application through Civil Claims Online.","Request a regular motions day from the Trial Coordinator exactly as for a Short Motion (step 2 above).","Serve the issued Notice of Application at least 10 days before that date, file the Application Record, and confirm with **Form 38B** filed and uploaded by **2:00 p.m., 5 days** before (PD para. 53)."]}]},{"title":"Central East – Long Applications","blocks":[{"t":"ol","items":["**Book a Triage Court date on [calendly.com/ce-civil](https://calendly.com/ce-civil) first**, before the application is issued (PD para. 66).","**Issue the Notice of Application** by filing it through [Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online) **together with the Calendly confirmation email**. The filing office then gives you a court file number.","**Email the local Trial Coordinator** the new court file number (with the Triage Court date and short title) so the event is entered into the scheduling system (PD para. 66).","Follow Long Motion sections B and C above (timetable, 14-day filing, 2-page triage memo).","**Confirm:** email the revised **Form 38B** to the local Trial Coordinator by **2:00 p.m., 5 days** before the hearing, then file and upload a copy (PD para. 87)."]}]},{"title":"Central East – In Writing, Consent and Without Notice","blocks":[{"t":"ul","items":["**Basket Motions (PD paras. 34–39):** consent, without notice and unopposed motions must be brought as basket motions. File them through JSO (or at the court office) **with the fee paid**, and include a draft order in **both Word and PDF**. Do **not** send them to the Trial Coordinator or email them to a Judge. Case Center upload is not required. Contested or uncertain matters cannot go in the basket.","**Motions in Writing (r. 37.12.1, PD paras. 29–31):** the parties agree on a timetable, file all materials through the filing office, and the motion is placed before a Judge. Case Center upload is not required.","**Rule 7 motions (PD paras. 32–33):** submit as in-writing motions through the filing office. To have one heard in person, email the local Trial Coordinator.","**Administrative dismissals (r. 48.14, PD paras. 136–138):** consent/unopposed requests are basket motions. Contested status hearings are booked on the **Thursday 9:00 a.m.** dismissal triage list via [calendly.com/ce-civil/civil-admin-dismissals](https://calendly.com/ce-civil/civil-admin-dismissals); email the timetable and draft order to the Trial Coordinator **five business days** before."]}]},{"title":"Central East – Urgent Motions","blocks":[{"t":"ol","items":["Prepare a letter of request covering: why the matter is urgent; the relief sought; whether it is on notice; whether the materials are ready; a time estimate; and attach a **draft order** (PD para. 98).","Email it to the local Trial Coordinator (see Contacts) with the subject line *\"Request to SCHEDULE URGENT Motion/Application – [File Name and Number], [Originating Court Location]\"* (PD para. 97).","The triage Judge decides whether to give an early fixed date or place it on the running list, and the Trial Coordinator emails you the result (PD para. 99)."]}]},{"title":"Central East – Confirmation","blocks":[{"t":"table","headers":["Matter","Deadline","Method"],"rows":[["Short Motions / Applications (PD para. 53)",["Moving party: **2:00 p.m., 5 days** before","Responding party: **10:00 a.m., 4 business days** before","Or jointly by 2:00 p.m., 5 days before"],"File Form 37B/38B through JSO, **then** upload it to Case Center."],["Long Motions (PD para. 86)","**2:00 p.m., 5 days** before","Email revised Form 37B (with the agreed timetable) to the local Trial Coordinator; file a copy through JSO; upload to Case Center."],["Long Applications (PD para. 87)","**2:00 p.m., 5 days** before","Email revised Form 38B to the local Trial Coordinator; file a copy; upload to Case Center."]]},{"t":"p","text":"List only the specific issues to be decided and cite **volume, tab and Case Center master page numbers**; references to \"all affidavits\" are ignored (PD para. 56). Include a time estimate for all parties (PD para. 57)."},{"t":"note","label":"Consequences:","items":["No Confirmation filed **and** uploaded = short motion removed from the list and the date vacated (PD para. 55). For long motions and applications, if neither party files and uploads a Confirmation, the **hearing date is vacated** (PD para. 87)."]}]},{"title":"Central East – Materials & Case Center","blocks":[{"t":"ul","items":["Non-compliant documents are rejected and cannot be uploaded (PD para. 49). Late materials are only allowed with the presiding Judge's leave (PD para. 50).","A Compendium is mandatory where more than **25 pages** of documentary evidence are filed (PD para. 14).","Bring a Costs Outline (Form 57B, three pages maximum) to every contested hearing."]}]},{"title":"Central East – Adjournments","blocks":[{"t":"ul","items":["**Consent:** with written consent from all parties, email **CErunninglist@ontario.ca** (copy all parties), subject *\"Request to ADJOURN long motion – CONSENT – [File Name and Number], [Originating Court Location]\"*, stating the request, that all parties consent, and why. **Only one** consent adjournment is granted and the matter goes to the back of the queue (PD paras. 76–78).","**Opposed, more than 5 days before the hearing:** email CErunninglist@ontario.ca (copy all parties), subject *\"Request to ADJOURN long motion – OPPOSED – …\"*, with a letter and a two-page memo. Responding memo due within five days (PD para. 79).","**Within 5 days of the hearing:** ask the presiding Judge on the hearing day; bring the timetable agreement and Costs Outlines and be ready to argue if refused (PD paras. 80–83)."]}]},{"title":"Central East – Filing","blocks":[{"t":"ul","items":["Everything is filed electronically through [Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online) (para 11). If you truly cannot, file in person with a written explanation. Non-compliant or over-length documents are rejected and cannot go to Case Center (para 13).","**Compendium** required where more than **25 pages** of documentary evidence are filed (para 14).","Long motions and applications: the filing office will **not accept** materials without the **Calendly triage confirmation email** attached (paras 64, 68, 88)."]}]},{"title":"Central East – Case Center","blocks":[{"t":"ul","items":["Follow the provincial [Case Center Guide to Requirements](https://www.ontariocourts.ca/scj/guides-and-service-resources/case-center/) (para 20). Ask the local **filing office** (not the Trial Coordinator) for access (para 47).","No Case Center upload for motions in writing, Rule 7 in-writing motions or basket motions (paras 30, 33, 37).","Short motions: upload on or before the confirmation deadline (para 48). Long motions: upload as soon as you receive the Calendly invite, and everything (incl. factums and compendiums) at least **14 days before triage** (paras 62, 89).","Triage Court: 2-page memo in the Triage Court bundle **3 days** before; trial record in the Trial bundle **3 days** before (paras 148–149). Pre-trial memoranda: no later than **5 days** before the pre-trial (para 129)."]}]},{"title":"Central East – Mode of Appearance","blocks":[{"t":"table","headers":["Mode","Civil events (para 2)"],"rows":[["In person","Jury, non-jury and judge-alone trials; contested long motions and applications"],["Virtual","Pre-trials; case conferences/case management; assessment hearings; Triage Court; contested short motions and applications"],["In writing","Costs; consent, without notice and unopposed motions"]]},{"t":"p","text":"To change the mode, email a written request to the Trial Coordinator (copying all parties) at the earliest opportunity and **no later than the first scheduled event**; it will not be considered on the hearing date (paras 5–7). For a virtual long motion, send a letter of no more than 2 pages to the local Trial Coordinator (para 60)."}]},{"title":"Central East – Case Conferences","blocks":[{"t":"ol","items":["Complete the [Civil Conference Request Form](https://www.ontariocourts.ca/scj/files/forms/ce/CE-Civil-Telephone-Case-Conference-Hearing-Request-Form.docx) (r. 50.13) and email it to **CERcivilappointments@ontario.ca** (paras 104–105).","Conferences are **procedural only**, maximum **30 minutes** (strictly enforced), by telephone or video (para 106).","Required if parties cannot agree a long-motion timetable within 30 days (para 73). Not available in Construction Act actions (para 107)."]}]},{"title":"Central East – Pre-Trial Conferences","blocks":[{"t":"ol","items":["The lawyer with carriage must book it — the court will not (para 110). **On consent:** book on [calendly.com/ce-civil-pretrials](https://calendly.com/ce-civil-pretrials) using \"Add Guests\" for all parties (paras 111–114). A pre-trial not consented to by all parties is cancelled (para 116).","**Not on consent:** email **Newmarket.Civilpretrial@ontario.ca**, copying the other side, subject *\"Request to SCHEDULE pre-trial – OPPOSED – [File Name and Number], [Originating Court Location]\"*. The other side has **48 hours** to respond (max 2 pages); the triage judge decides (paras 117–119).","Pre-trials are scheduled, where possible, within **120 days** of the trial date or sittings (para 121). Parties with settlement authority and trial counsel attend (para 122).","**7 days before:** consult and complete the [Rule 50.08 Pre-trial Conference Report](https://www.ontariocourts.ca/scj/files/forms/ce/CentralEast-PTC-report-form-EN.docx) (or Rule 76 report); the **plaintiff** serves, files and uploads it (paras 123–124). Expert reports (r. 53.03) with the Certificate — late reports risk costs and exclusion (para 126).","**Pre-trial memoranda:** file only once the pre-trial is granted; max **15 pages**; extra documents hyperlinked or uploaded (never emailed); file through JSO and upload **no later than 5 days** before, with the [Pre-Trial Confirmation Form](https://www.ontariocourts.ca/scj/files/forms/ce/CentralEast-PTC-Confirmation-Form-EN.docx) (paras 127–131). The Zoom link appears in Case Center 1–2 days before (para 132)."]}]},{"title":"Central East – Trial Scheduling and Trials","blocks":[{"t":"ul","items":["Setting down bars further discovery or interlocutory motions without leave (r. 48.04; para 135).","If ready at the pre-trial, the judge fixes a trial date in the **Civil Blitz** — **January (3 weeks)** and **September (5 weeks)** sittings — or another time; if not ready, comply with the pre-trial order and return for a further pre-trial or Triage Court (paras 139–140, 152–154). Trials over **four weeks**: write to the RSJ for a fixed date (para 141).","**Triage Court** (Tuesdays 9:00 a.m., virtual, 5-minute slots, no gowns) fixes trial, long motion and application dates, second pre-trials and adjournments. Book on [calendly.com/ce-civil](https://calendly.com/ce-civil) with \"Add Guests\"; file and upload a **2-page memo** at least **3 days** before and the trial record to the Trial bundle; cancel only by agreement via the Calendly \"cancel\" button **3 business days** before (paras 142–151).","Trials are called oldest first and may be heard anywhere in the region (paras 156–157). Once listed you are deemed ready. **Adjournments:** first consent request in writing to the RSJ; second or opposed request at Triage Court; contested adjournments only in exceptional circumstances (para 158).","The trial list is posted on the court website before each sitting; Trial Coordinators will not contact counsel (para 159)."]}]},{"title":"Central East – Transfers and Mortgage Proceedings","blocks":[{"t":"ul","items":["**Transfers** between regions: follow the Provincial PD and r. 13.1.02, bringing the motion in the region **to which** transfer is sought; the court may also transfer on its own initiative (paras 26–28).","**Mortgage proceedings** for property anywhere in Central East must be commenced in **Barrie or Oshawa** (r. 13.1.01(3); para 25)."]}]},{"title":"Central East – Administrative Dismissals (Rule 48.14)","blocks":[{"t":"ul","items":["**Consent or confirmed unopposed** motions on r. 48.14 timelines (and consent timetables) are **basket motions in writing** before a judge (para 136).","**Contested status hearings:** book the **Thursday 9:00–10:00 a.m.** virtual dismissal triage court (max 12 matters, 5 minutes each) on [calendly.com/ce-civil/civil-admin-dismissals](https://calendly.com/ce-civil/civil-admin-dismissals) with \"Add Guests\"; consult on a timetable first (paras 136, 138).","Agreed timetables are **not filed or uploaded** — email the timetable and a draft order to the local Trial Coordinator **5 business days** before the hearing (para 137)."]}]},{"title":"Central East – Costs","blocks":[{"t":"ul","items":["Attend every motion and application with a **costs outline** (Form 57B, max 3 pages) ready to hand up; without one, the judge may decline to award you costs (paras 100, 102). Do not routinely file written costs submissions afterwards (para 101).","Costs risks include: basket matters brought on a regular list (para 35), late materials (para 50), withholding agreement to a timetable (para 73), wrongly cancelling triage (para 84) and late expert reports (para 126)."]}]},{"title":"Central East – Construction Liens","blocks":[{"t":"ol","items":["Lien pre-trials are presumptively by video; book on [calendly.com/ce-civil-pretrials](https://calendly.com/ce-civil-pretrials) (para 161). Costs can be ordered against parties who do not cooperate (para 162).","**Timetable order:** either a settlement meeting under O. Reg. 302/18 ss. 9–10 with a filed statement of settlement, or a **Timetable Pre-trial Hearing** (30-minute slots by video) requested by email to **Newmarket.civilpretrial@ontario.ca** (the PD text shows \"civilpretrial@ontario.ca\"; confirm) (paras 164–165).","For the timetable hearing, file and upload: a one-page purpose statement; draft orders if no consent; a **title search no more than 3 days old** showing deleted instruments; and a list of all related actions; plus an affidavit of service of the Notice of Trial on everyone with an interest in the land (paras 168–169).","**First substantive pre-trial:** trial counsel and clients attend; have exchanged affidavits of documents, fixed discovery and undertaking dates, any Scott Schedule, a lien chart, expert reports and a pre-trial memorandum served and filed **7 days** before (paras 171–172). Liens under **$200,000** get no more than **two** pre-trials (para 179)."]}]},{"title":"Central East – Contacts","blocks":[{"t":"table","headers":["Courthouse","Trial Coordinator","Filing Office / Case Center Access"],"rows":[["Barrie, Bracebridge, Orillia","Barrie.SCJ.TC@ontario.ca","Barrie.SCJ.courts@ontario.ca"],["Newmarket","Newmarket.SCJ.TC@ontario.ca","Newmarket.SCJ.courts@ontario.ca"],["Oshawa","Oshawa.SCJ.TC@ontario.ca","Durham.SCJ.courts@ontario.ca"],["Peterborough","Peterborough.SCJ.TC@ontario.ca","Peterborough.SCJ.courts@ontario.ca"],["Lindsay","Peterborough.SCJ.TC@ontario.ca","Lindsay.courts@ontario.ca"],["Cobourg","Peterborough.SCJ.TC@ontario.ca","Cobourg.court@ontario.ca"]]},{"t":"p","text":"**Regional:** opposed long motion requests and adjournments – CErunninglist@ontario.ca. Civil case conferences – CERcivilappointments@ontario.ca."}]}],"central-west":[{"title":"Chapter 3 — Central West Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Central West Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-west-region/) (effective June 1, 2026)"],["Courthouses","Brampton, Milton, Guelph, Orangeville, Owen Sound, Walkerton (Burlington is Small Claims)"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-claim-online) (Civil Claims Online / Civil Submissions Online)"],["Short vs. Long","**Less than one hour** = Short (\"Regular\") Motion. **One hour or more** = Long Motion (motions and applications)."],["Booking","Short: courthouse **Calendly** only. Long: Requisition emailed to the trial office for **Triage Court** (Brampton, Milton) or a **Triage Conference** (Guelph, Orangeville, Owen Sound, Walkerton)."],["Confirmation","Form 37B/38B emailed to the courthouse **trial office**, then uploaded. Short: moving party by **2:00 p.m., 5 business days** before. Long: all parties by **2:00 p.m., 7 days** before."],["Mode","Short and Long Motions: **in person**. Consent/unopposed and urgent requests: in writing. Ask to change mode at least 14 days before."]]}],"h1":true},{"title":"Central West – Short (Regular) Motions","blocks":[{"t":"p","text":"Short/regular motions take **less than one hour** in total, including any cross-motion (PD paras. 26–27). In Brampton and Milton, Calendly offers regular motions \"before a Judge or an Associate Judge\"; pick the correct one."},{"t":"ol","items":["**Agree on the date** with all parties (Calendly requires you to confirm you have conferred).","**Book on the courthouse Calendly** (PD para. 25): [Brampton](https://calendly.com/brampton-scj) · [Milton](https://calendly.com/milton-scj) · [Orangeville](https://calendly.com/orangeville-scj) · [Guelph](https://calendly.com/guelph-scj) · [Owen Sound & Walkerton](https://calendly.com/owensoundwalkerton-scj). Choose \"Civil – Regular Motion (less than 1 hour)\". You must give Calendly the confirmations and undertakings it asks for (PD para. 37).","**Forward the Calendly confirmation** to all parties.","**Serve and file** the Notice of Motion (returnable on the Calendly date) and Motion Record through JSO. Booking alone does not schedule the motion; the materials must be filed (PD para. 35).","**Upload** the court-stamped, accepted documents to the correct Case Center bundle immediately (PD paras. 17, 52).","**Confirm:** email Form 37B to the courthouse **trial office** (see Contacts) by **2:00 p.m., 5 business days** before; once accepted, upload it to Case Center (PD paras. 46, 52)."]},{"t":"note","label":"IMPORTANT:","items":["Calendly will **not** take a booking within **10 days** of the hearing, and the trial office will **not** book short motions by email or phone (PD para. 38).","To move a date on consent, rebook in Calendly and **cancel the old date in Calendly** (PD para. 39). If the matter settles before the confirmation is filed, cancel in Calendly; if it settles within 5 days of the hearing, you must still attend unless the Court directs otherwise (PD paras. 41, 43)."]}]},{"title":"Central West – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Long motions are motions and applications that will take **one hour or more** (PD para. 53). Summary Judgment Motions follow this process."},{"t":"h3","text":"Brampton and Milton – Triage Court"},{"t":"ol","items":["**Serve** a complete motion (or application) record with the return date shown as **\"TBD\"** (PD para. 54).","**Negotiate a timetable** with all parties for every remaining step (responding/reply materials, cross-examinations, factums) (PD para. 56).","**If the timetable is agreed:** complete the [Requisition to Attend Triage Court](https://www.ontariocourts.ca/scj/files/forms/cw/requisition-to-attend-triage-court-br-mil-2026.docx), mark the timetable as **on consent of all parties**, and email it to the trial office (**scjtrialofficebrampton@ontario.ca** or **SCJHaltontrialoffice@ontario.ca**), copying all parties. The Triage Judge reviews it and issues it as an order; **no attendance is needed** unless the Judge has concerns (PD paras. 57, 63–64).","**If no timetable is agreed within 45 days** of service of the moving party's record: any party emails the same Requisition requesting a Triage Court **attendance** to set a timetable (PD para. 58).","Triage Court sits virtually: **Brampton – Tuesdays at 9:00 a.m.**; **Milton – Thursdays at 9:00 a.m.**; 10 minutes per matter; no gowns (PD paras. 61–62).","**Once every timetabled step is complete**, the moving party emails an **updated Requisition** to the trial office to return to Triage Court and **obtain the hearing date** (PD para. 59).","**Confirm:** all parties email Form 37B to the trial office by **2:00 p.m., 7 days** before the hearing, then upload it to Case Center (PD paras. 87–88)."]},{"t":"h3","text":"Guelph, Orangeville, Owen Sound and Walkerton – Triage Conference"},{"t":"ol","items":["Complete the [Requisition to Attend Triage Conference](https://www.ontariocourts.ca/scj/files/forms/cw/requisition-to-attend-triage-conference-gue-org-walk-os-2026.docx).","Email it to the courthouse trial office (see Contacts), **copying all other parties** (PD para. 66).","The Court contacts the parties to schedule a **virtual Triage Conference** before a Judge, who sets the timetable for materials, cross-examinations and other steps (PD para. 67).","When the steps are done, a follow-up Triage Conference confirms the **hearing date**.","**Confirm** by email to the trial office by **2:00 p.m., 7 days** before, then upload."]},{"t":"note","label":"Factums:","items":["A factum is required on all long motions; if the moving party does not file one on time, **the motion date is cancelled**. Limit 20 pages; leave for more must be obtained at Triage (PD paras. 84–85). A joint compendium is encouraged (PD para. 86)."]}]},{"title":"Central West – Short Applications","blocks":[{"t":"p","text":"The short motion section of the Practice Direction refers only to motions and Calendly lists only \"Regular Motion\". **Practice tip:** before issuing a short application, email the courthouse trial office asking whether it should be booked on the \"Civil – Regular Motion\" Calendly calendar or by Requisition, then follow their direction. Confirmation is by Form 38B on the short motion deadlines."}]},{"title":"Central West – Long Applications","blocks":[{"t":"p","text":"Long civil applications are \"Long Motions\" for scheduling. Issue the application, serve the Application Record with a \"TBD\" return date, and follow the Triage Court / Triage Conference steps above. Confirm with Form 38B by 2:00 p.m., 7 days before."}]},{"title":"Central West – In Writing, Consent and Without Notice","blocks":[{"t":"ol","items":["Simple, procedural, consent and known uncontested matters **must** be brought as **basket motions** (PD para. 89).","File the motion through JSO with a **draft order in Word**. Every document must have **hyperlinks and bookmarks** or it is rejected (PD para. 90).","Do **not** upload to Case Center (PD para. 90).","Do not put a basket-type matter on the regular list; the Judge will send it back and may award costs (PD para. 91)."]}]},{"title":"Central West – Urgent Motions","blocks":[{"t":"ol","items":["Write a letter to the Court setting out: why it is urgent; the relief sought; whether it is on notice (and if not, why not); whether materials are ready; a time estimate; and attach a **draft order in Word**. Do not argue the merits (PD paras. 100–101).","Copy the letter to all interested parties unless the request is made without notice.","Email it, with the proposed motion materials, to the courthouse **civil filing email** (see Contacts). Email filing is permitted for urgent hearings (PD paras. 5, 8).","A Judge reviews the urgency claim. If not urgent, book through Calendly (short) or Triage (long) (PD paras. 102–103). No factum is needed for an urgent motion without notice (PD para. 105)."]}]},{"title":"Central West – Confirmation","blocks":[{"t":"table","headers":["Matter","Deadline","Consequence"],"rows":[["Short / Regular Motions (PD para. 46)",["Moving party: **2:00 p.m., 5 business days** before","Responding party: **10:00 a.m., 3 business days** before"],"If no party files, the motion does not proceed and the date is vacated (PD para. 45)."],["Long Motions (PD para. 87)","All interested parties: **2:00 p.m., 7 days** before","If no party files, the date is vacated and given to other matters on short notice."]]},{"t":"p","text":"**How to file it:** email the completed Form 37B/38B to the courthouse **trial office** address in Contacts (PD paras. 10, 87). **Practice tip:** use the subject line *\"CONFIRMATION – [Court File Name and Number] – [Hearing Date]\"*. After it is accepted, upload it to the correct Case Center bundle (PD para. 52). You must consult the other side first on time, materials and possible resolution (PD para. 48). List the specific issues (never \"all issues\"), the affidavits and paragraph numbers with Case Center page references, the time for all parties, and any request for leave to file late material (PD paras. 49–51)."}]},{"title":"Central West – Materials & Case Center","blocks":[{"t":"ul","items":["Documents that fail filing standards (12-point font, double spacing, margins, page limits) are rejected and must not be uploaded (PD para. 3).","Upload filed, court-stamped documents to Case Center immediately after filing. Case Center is used for all civil events except Assignment Court and Triage Court (PD paras. 17–18).","Email filing is only allowed where the matter is urgent or the hearing/deadline is **fewer than 5 business days** away (PD para. 5)."]}]},{"title":"Central West – Adjournments","blocks":[{"t":"ul","items":["Long motion adjournments are strongly discouraged. **Only one** adjournment on consent (PD paras. 68–69).","**Contested, more than 21 days before:** email a new Requisition to the trial office to return to Triage. **Less than 21 days:** argue it before the motions Judge and flag it on the Confirmation (PD paras. 70–71).","**Consent, more than 7 days before:** email the trial office and return to Triage for a new date. **Within 7 days:** only for clear and compelling reasons beyond the parties' control (PD paras. 72, 80–81).","If settled, tell the trial office **immediately** (PD para. 83)."]}]},{"title":"Central West – Filing","blocks":[{"t":"ul","items":["Civil documents must meet Rules 4.01–4.12; anything failing format or length standards (12-point font, double spacing, margins, page limits) is rejected and must not be uploaded (paras 2–3). File through the right portal — Civil Claims Online or Civil Submissions Online — or it is rejected (paras 4, 9).","**Email filing** (addresses in Contacts) is allowed only if: the matter is urgent with an urgent hearing request; the court date or deadline is **fewer than 5 business days** away; for accessibility; or by court order/statute (paras 5, 8).","Small Claims files through Small Claims Online (para 11)."]}]},{"title":"Central West – Case Center","blocks":[{"t":"ul","items":["One bundle per court attendance — upload to the bundle for that attendance, immediately after filing, using the **court-stamped** version (paras 16–17). Ask the Court Administrative Office for an invite if needed.","Case Center is used for all civil events except **Assignment Court and Triage Court** (para 18).","**Do not upload:** CAS records, unredacted financial records, other confidential documents, or unredacted affidavits on motions to get off the record — note in Case Center that they were filed but not uploaded and tell the judge at the start (paras 19–20).","Forward a Case Center invitation to new counsel or parties with outdated contact details (para 14). Orders and endorsements are released through Case Center (para 22)."]}]},{"title":"Central West – Mode of Appearance","blocks":[{"t":"table","headers":["Mode","Civil events (Part 1 A)"],"rows":[["In person","Jury and non-jury trials; short motions; long motions and applications"],["Virtual","Pre-trials; case conferences/case management; Assignment Court / TBST Court"],["In writing","Consent and unopposed motions; requests for urgent motions"]]},{"t":"p","text":"Mode changes are granted only in exceptional circumstances and must be requested **at least 14 days** before the hearing; later requests are considered only in an emergency (para 1)."}]},{"title":"Central West – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Book on the courthouse **Calendly** (Milton, Orangeville, Guelph, Owen Sound & Walkerton). **Brampton** pre-trials are set at **Assignment Court** — options are posted on Calendly up to two weeks before (paras 115–116).","Scheduled, where possible, within **120 days** and not less than **30 days** before trial (para 117).","Counsel jointly complete the [Form 50.08 Pre-Trial Form](https://www.ontariocourts.ca/scj/files/forms/trial-management-report-regular-EN.docx) (or file separate forms highlighting disputes) and upload it once accepted. Failure to cooperate can lead to adjournment, the trial being struck, a return to Assignment Court and costs (paras 118–119).","Deliver expert reports **at least 90 days** before the pre-trial, with the r. 50.03 experts certificate (para 120)."]}]},{"title":"Central West – Trial Scheduling and Trials","blocks":[{"t":"ul","items":["In some locations the Registrar gives the party who set the action down an **Assignment Court** date; that party lists all interested parties in the Notice of Assignment Court (para 112).","At Assignment Court the action is placed on a trial list (all parties deemed ready) or **struck** (para 113). To restore a struck action (r. 48.11), write to the court on consent confirming readiness (para 114).","Setting down bars further discovery or interlocutory motions without leave (r. 48.04; para 111). Trial adjournments are rarely granted, even on consent — bring a motion record to the RSJ, LAJ or designate (para 121)."]}]},{"title":"Central West – Transfers and Mortgage Proceedings","blocks":[{"t":"ul","items":["Transfers between regions must follow r. 13.1.02 and the Provincial PD (para 97).","**Mortgage proceedings** are commenced where the property is: **Peel – Brampton; Halton – Milton; Wellington – Guelph; Dufferin – Orangeville; Grey and Bruce – Owen Sound** (para 98)."]}]},{"title":"Central West – Receiverships and Commercial Matters","blocks":[{"t":"p","text":"Receivership applications and motions are ordinary civil proceedings in Central West; urgent attendance requests go to the RSJ or designate (para 107). The PD has no separate Commercial List, class action or bankruptcy procedure — follow the Provincial PD."}]},{"title":"Central West – Costs","blocks":[{"t":"p","text":"Costs can follow: inaccurate time estimates (paras 28–29), Calendly non-compliance (para 37), contested cancellations (para 40), failing to consult before a confirmation (para 48), vague confirmations (para 87), basket matters on a regular list (para 91) and late expert reports (para 120). On contested adjournments bring a **bill of costs** (para 74); if an adjournment is granted, bring **costs outlines** (para 79)."}]},{"title":"Central West – Contacts","blocks":[{"t":"table","headers":["Courthouse","Trial Office (Confirmations, Requisitions)","Civil Filing Email (urgent / < 5 business days only)"],"rows":[["Brampton","scjtrialofficebrampton@ontario.ca","BramptonSCJCourt@ontario.ca"],["Milton","SCJHaltontrialoffice@ontario.ca","miltonscjcourt@ontario.ca"],["Orangeville","OrangevilleSCJTrialOffice@ontario.ca","OrangevilleSCJCourt@ontario.ca"],["Guelph","scjtrialofficeguelph@ontario.ca","Guelph.SCJ.FamilyCivil@ontario.ca"],["Owen Sound","SCJGreyBruce@ontario.ca","OwenSound.SCJ.Courts@ontario.ca"],["Walkerton","SCJGreyBruce@ontario.ca","Walkerton.SCJ.Courts@ontario.ca"]]}]}],"central-south":[{"title":"Chapter 4 — Central South Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Central South Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-central-south-region/) (effective June 30, 2025; updated August 21, 2026)"],["Courthouses","Hamilton (John Sopinka), Kitchener (Waterloo Region), St. Catharines, Welland, Brantford, Cayuga, Simcoe"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)"],["Short vs. Long","**One hour or less** = Short. More than one hour **including reply** = Long."],["Booking","Short: make the motion returnable on a designated motions day. Long: returnable on a motions day, then adjourned by Confirmation to an agreed **\"Week of\" Ready List**."],["Confirmation","Form 37B/38B **emailed to the Trial Coordinator** (subject *\"CONFIRMATION – Court File Name and Number\"*) and uploaded to Case Center. Moving party: **2:00 p.m., 5 days** before."],["Mode","Short motions: presumptively virtual (in person / hybrid at Hamilton Sopinka). Long motions: in person."]]}],"h1":true},{"title":"Central South – Short Motions","blocks":[{"t":"p","text":"A short motion is one that can be argued in **one hour or less** (PD para. 129). There is no booking step: you choose a designated motions day and make the motion returnable that day (PD para. 129). Motions start at **10:00 a.m.** (PD para. 130):"},{"t":"table","headers":["Courthouse","Civil Motions Day"],"rows":[["Hamilton – John Sopinka","Every Tuesday and Thursday"],["Kitchener – Waterloo Region","Every Thursday"],["St. Catharines – Robert S.K. Welch","Every Thursday"],["Welland","Every Friday"],["Brantford","Designated Fridays (email BrantfS@ontario.ca for the dates)"],["Cayuga","Designated Tuesdays (email Cayuga.Superior.Court@ontario.ca for the dates)"],["Simcoe","Designated Thursdays (email Simcoe.Superior.Court@ontario.ca for the dates)"]]},{"t":"ol","items":["**Pick the motions day** with the other side and draft the Notice of Motion returnable that day at 10:00 a.m. (for Brantford, Cayuga and Simcoe, first email the Trial Coordinator for the designated dates).","**Serve and file** the Notice of Motion and Motion Record through JSO. Limits: one primary affidavit per party with no more than **12 pages** of narrative; third-party and reply affidavits **5 pages** each; exhibits only if necessary and relevant (PD para. 131).","**File the draft order (Form 59A) separately** from the Motion Record, in Word (PD para. 132).","**Upload** everything to Case Center at least **5 days** before the hearing (PD para. 134). Index entries must link to each tab, and affidavits must link to exhibits (PD para. 128).","**Confirm:** email Form 37B to the courthouse Trial Coordinator by **2:00 p.m., 5 days** before (subject line *\"CONFIRMATION – [Court File Name and Number]\"*), then upload it to the Case Center bundle (PD paras. 133, 149, 154–156)."]},{"t":"p","text":"The Practice Direction does not set a separate Associate Judge process for this region."}]},{"title":"Central South – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Long motions are those expected to take **more than one hour**, including reply (PD para. 135). They are not given a specific date; they are argued during a specified **week**, called the **\"Week of\" Ready List** (PD para. 136). Here is how a long motion gets there:"},{"t":"ol","items":["**Make the motion returnable on any designated motions day** (see the motions-day chart under Short Motions) and serve and file the Notice of Motion through JSO (PD para. 137).","**Agree on a timetable** with all parties for every step before the hearing: responding materials, productions, cross-examinations, and delivery of factums (PD para. 140). Put it in writing.","**Complete all materials.** Every party files a factum (maximum 20 pages, 12-point, double-spaced) and a **compendium** of the excerpted evidence essential to the motion; a joint compendium may go with the respondent's factum (PD paras. 141–142).","**Agree on the week.** Once all material is filed, the parties agree on the **week** in which all counsel are available to argue the motion.","**Confirm the motion to the \"Week of\" Ready List.** At least **5 days** before the return date, file a **Confirmation of Motion (Form 37B)** — or **Confirmation of Application (Form 38B)** — showing that the matter is to be **adjourned from the return date to the \"Week of\" Ready List for the week of [date]** agreed by the parties. Email it to the courthouse Trial Coordinator with the subject line *\"CONFIRMATION – [Court File Name and Number]\"* (PD paras. 137–138, 154–155).","**The Trial Coordinator schedules the motion for that week** (PD para. 138). Diarize the Monday of the assigned week.","**Upload** every document to Case Center at least **5 days** before the event, and upload the Confirmation to the bundle **5 full days** before (PD paras. 143, 156).","**Send the further confirmation.** No later than the **Thursday before the Monday** of the assigned week, email a further Confirmation to the Trial Coordinator listing (a) the issues to be decided, (b) the materials relied upon (volume, tab and page), and (c) counsel's availability during that week (PD para. 139). Be ready to be called on any day of the week."]},{"t":"note","label":"If the timetable breaks down:","items":["If an agreed or court-ordered timetable is not followed after the week has been assigned, a party must bring a motion returnable on an **earlier regular motions day** so all parties can speak to it (PD para. 140)."]}]},{"title":"Central South – Short Applications","blocks":[{"t":"p","text":"Issue the Notice of Application through Civil Claims Online, make it returnable on a designated motions day, and follow the Short Motion steps above. A **factum is required** even when an application is on the short motions list (PD para. 141). Confirm with **Form 38B** emailed to the Trial Coordinator by 2:00 p.m., 5 days before."}]},{"title":"Central South – Long Applications","blocks":[{"t":"p","text":"Issue the application returnable on a designated motions day, then follow the Long Motion steps above: timetable, factums and compendiums, agree on a week, and file a **Confirmation of Application (Form 38B)** adjourning the matter to the agreed **\"Week of\" Ready List**, followed by the further confirmation the Thursday before."}]},{"title":"Central South – In Writing, Consent and Without Notice","blocks":[{"t":"ol","items":["Prepare the motion with a **draft order (Form 59A) in Word**, provided separately from the Motion Record (PD para. 144).","File it with the court office through JSO **with the filing fee paid**.","It is placed before a Judge in chambers in the normal course. Do **not** send it to the Trial Coordinator or email it to a Judge."]}]},{"title":"Central South – Emergency Motions","blocks":[{"t":"ol","items":["An emergency is where a court order is needed to preserve life, liberty and property and time is of the essence (PD para. 124).","Email the courthouse Trial Coordinator (see Contacts) describing the relief sought and why it is urgent, and attach a **draft Notice of Motion** only (not the full materials) (PD para. 125).","A Judge reviews the request. If it is accepted as urgent, file the hearing materials through JSO (PD paras. 126–127)."]}]},{"title":"Central South – Confirmation","blocks":[{"t":"p","text":"Every motion and application, long or short, must be confirmed, even if it has a fixed date (PD para. 148). Use **Form 37B or 38B** (PD para. 149):"},{"t":"ul","items":["Moving party: by **2:00 p.m., 5 days** before the hearing","Responding party: by **10:00 a.m., 4 days** before the hearing","Or jointly on or before **2:00 p.m., 5 days** before the hearing"]},{"t":"ol","items":["Consult the other side before filing (PD para. 150).","List only the specific issues, the materials with **volume, tab and page** references, and a time estimate for all parties (PD paras. 152–153).","Email it to the courthouse Trial Coordinator with the subject line **\"CONFIRMATION – [Court File Name and Number]\"** (PD paras. 154–155).","Upload it to the Case Center bundle **5 full days** before the motion (PD para. 156).","If the motion later settles (with an executed consent and draft order) or will be adjourned, tell the Trial Coordinator **immediately** and upload a **revised** Confirmation to Case Center (PD para. 157)."]},{"t":"note","label":"Consequence:","items":["Where neither party files a Confirmation, the motion **may not proceed** (PD para. 151)."]}]},{"title":"Central South – Filing and Case Center","blocks":[{"t":"ul","items":["Filing follows the Provincial PD (para 11). Limited **email filing** uses the courthouse civil filing addresses in Contacts (para 123).","Consent, without notice, unopposed and in-writing motions must be filed with the court office with the fee — never sent to the Trial Coordinator or a judge (para 144).","Records, compendiums and books of authority must be **bookmarked and hyperlinked** (index to tabs, affidavit to exhibit and back), and the links must survive download from Case Center (para 128).","Upload deadlines: short and long motion documents **5 days** before; confirmations **5 full days** before; pre-trial reports and documents **5 days** before (paras 134, 143, 156, 160, 162).","Case Center is used for case conferences, pre-trials, short and long motions and non-jury trials — **not** for consent motions, Trial Scheduling Court, Speak to Court or jury trials (Part 1 table)."]}]},{"title":"Central South – Mode of Appearance","blocks":[{"t":"table","headers":["Mode","Civil events (para 1)"],"rows":[["In person","Long motions/applications (over 1 hour); non-jury and jury trials"],["Virtual","Case conferences (usually teleconference); pre-trials; short motions (in person or hybrid also available at Hamilton Sopinka); Trial Scheduling/Assignment Court; Speak to Court"],["In writing","Consent, unopposed and ex parte motions"]]},{"t":"p","text":"To change the mode: email the courthouse Trial Coordinator (copying all parties) at the first opportunity — no later than when first scheduling the event and at least **14 days** before — with the subject line **\"REQUEST FOR CHANGE IN PRESUMPTIVE MODE, [Case Name and File #]\"**. A judge decides by telephone conference; it will not be considered on the hearing date (paras 2, 8–10)."}]},{"title":"Central South – Case Conferences","blocks":[{"t":"ol","items":["Complete the [Civil Conference Request Form](https://www.ontariocourts.ca/scj/files/forms/cs/civil-conference-request-form-en.docx) and file it with the courthouse Trial Coordinator (para 145).","Once a date is given, upload the pleadings and necessary documents to Case Center (para 146).","For a timetable, upload the consent timetable — or, if no agreement, each party's proposed timetable (para 147)."]}]},{"title":"Central South – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Scheduled, where possible, within **120 days** of the trial date or sittings (para 163).","**90 days before:** deliver all expert reports (r. 53.03) and the r. 50.03 certificate; late reports risk costs and exclusion (para 164).","**7 days before:** consult and complete the [Rule 50.08 Pre-Trial Conference Report](https://www.ontariocourts.ca/scj/files/forms/trial-management-report-regular-EN.docx) (or the [Rule 76 Report to the Trial Judge](https://www.ontariocourts.ca/scj/files/forms/trial-management-report-rule76-EN.docx)) (para 159).","**5 days before:** file the report and upload it and all pre-trial documents to Case Center (paras 160, 162).","**Brief:** max **20 double-spaced pages**, starting with a 1–2 page **executive summary**; use excerpts, do not attach medical, expert or contract documents (para 158)."]}]},{"title":"Central South – Trial Scheduling and Trials","blocks":[{"t":"ol","items":["Set the action down by **filing a trial record**. The registrar gives you a notice of **trial scheduling court**; serve it on all parties **within 5 days** (paras 165, 168).","Before that court, get available trial and pre-trial dates from the Trial Coordinator and agree on them with the other parties (para 169).","If you agree, file a **Form 2 Consent** with the Trial Coordinator asking that the agreed sittings and pre-trial be assigned. If received by **2:00 p.m. three business days** before trial scheduling court, no one needs to attend (para 170). Only disagreements are spoken to at the virtual court (paras 171–175).","To adjourn trial scheduling court on consent, email a consent signed for all parties to the Trial Coordinator by **2:00 p.m. three business days** before (para 173).","**Short trials** (20 days or less) run in sittings listed in the [Regional Court Calendar](https://www.ontariocourts.ca/scj/filing-procedures/provincial/schedules/cs/); once on a sitting you are deemed ready (r. 48.07) and must proceed when called (paras 166–167, 176). Hamilton, Kitchener, St. Catharines and Welland hold **trial readiness courts** before civil sittings (para 180).","**Long trials** (over 20 days) run in March and October sittings with fixed start dates. Refer them to the RSJ office and email the [Long Trial Sittings Intake Form](https://www.ontariocourts.ca/scj/files/forms/cs/long-trial-form-EN.doc) to **rsjofficecentralsouth@ontario.ca** within **10 days** of the request or referral (paras 182–187).","Tell the Trial Coordinator immediately of settlements, likely adjournment requests, opening motions, jury waivers, interpreters or judicial conflicts (para 177). Short trial adjournments: request a case conference call with a judge; long trials: arrange a call with the RSJ (paras 179, 188). Restoring a struck action needs a r. 48.11 motion with counsel's affidavit (para 189)."]}]},{"title":"Central South – Transfers and Mortgage Proceedings","blocks":[{"t":"ul","items":["**Out of or into Central South:** file the transfer motion in the court office of the county **to which** transfer is sought (rr. 4.05(2)4, 13.1.02(3.1)). Transfers into Central South are heard by the Central South RSJ in writing or virtually. Once granted, issue and enter the order where the action started, then requisition the file transfer (paras 190–195).","**Within the region:** bring the motion where the action was started; on consent the LAJ hears it, otherwise it goes to a weekly motions court; the receiving site's LAJ is consulted first (paras 196–198).","**Mortgage proceedings** for property anywhere in the region may be commenced in Brantford, Cayuga, Hamilton, Kitchener, St. Catharines, Simcoe or Welland (para 199)."]}]},{"title":"Central South – Class Actions","blocks":[{"t":"p","text":"Follow the Provincial PD class action rules. Two judges are designated Class Proceedings judges for the region — get their names from the Regional Manager, Judicial Services: (905) 645-5323 or **rsjofficecentralsouth@ontario.ca**, and **notify the Regional Manager in writing** when a class action has been or is about to be commenced (paras 200–201)."}]},{"title":"Central South – Bankruptcy and Insolvency","blocks":[{"t":"ol","items":["Associate Judges sitting as **Registrars in Bankruptcy in Hamilton** hear matters virtually, in writing or by phone/video (in person only on request and direction) (paras 202–203).","Attach a completed **Hearing Request Form** (mode, dates, time estimate) to your materials; add a **Special Appointment Request Form** if over one hour (para 204).","Consent/unopposed bankrupt discharges (no conduct or s. 178 issues): email the materials and Hearing Request Form to **Hamiltonciviloffice@ontario.ca** and ask for the next available date. Attachments max **35 MB**; use the naming protocol and a hyperlinked index (paras 209, 212, 214).","Heard in writing: trustee discharges, SRD and legal bill taxations (with the required package), extensions of proposal periods, unopposed Division I proposals, substituted service, s. 38, re-appointing trustees, s. 30(4) sales and similar (paras 205–207, 213). After a date is assigned, serve per the BIA and r. 37.12.1 (para 216). Orders are delivered electronically (para 217)."]}]},{"title":"Central South – Costs","blocks":[{"t":"p","text":"Costs consequences can follow broken hyperlinking rules (para 128), late factums (para 141), referring the judge to documents you will not use (para 152), failing to upload a revised confirmation after settlement or adjournment (para 157), late expert reports (para 164) and adjourning a long trial (para 184)."}]},{"title":"Central South – Contacts","blocks":[{"t":"table","headers":["Courthouse","Trial Coordinator (Confirmations, Emergencies)","Civil Filing Email (limited use)"],"rows":[["Hamilton","Hamilton.Superior.Court@ontario.ca","Hamiltonciviloffice@ontario.ca"],["Kitchener","Kitchener.Superior.Court@ontario.ca","KitchenerCivil-SCC-Enforcement@ontario.ca"],["St. Catharines","St.Catharines.Superior.Court@ontario.ca","SCJStCatharinesCourthouse@ontario.ca"],["Welland","Welland.Superior.Court@ontario.ca","SCJWellandCourthouse@ontario.ca"],["Brantford","BrantfS@ontario.ca","Brantfordscjcourt@ontario.ca"],["Cayuga","Cayuga.Superior.Court@ontario.ca","HaldimandCountyCourt@ontario.ca"],["Simcoe","Simcoe.Superior.Court@ontario.ca","Simcoe.SCJ.Courts@ontario.ca"]]},{"t":"p","text":"Civil case conferences: complete the [Civil Conference Request Form](https://www.ontariocourts.ca/scj/files/forms/cs/civil-conference-request-form-en.docx) and email it to the courthouse Trial Coordinator. Once a date is given, upload the pleadings and the consent (or each party's proposed) timetable to Case Center (PD paras. 145–147)."}]}],"east":[{"title":"Chapter 5 — East Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Practice Direction – East Region](https://www.ontariocourts.ca/scj/practice_directions/practice-direction-for-the-east-region/) (effective June 30, 2025), together with the [SCJ East Region Notices](https://ln5.sync.com/dl/7a6d801c0#gh879xzg-k54cxduk-z6kkyvr6-mfsvcw58) (local directives)"],["Courthouses","Ottawa, Kingston, Belleville, Brockville, Cornwall, L'Orignal, Napanee, Pembroke, Perth, Picton"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)"],["Short vs. Long","**60 minutes or less** = Short (Ottawa: **2 hours and under** under its local directive). Over that = Long."],["Booking","Ottawa short: [calendly.com/ottawa-scj-civil](https://calendly.com/ottawa-scj-civil). Ottawa long: Associate Judges' office (mastersofficeottawa@ontario.ca). Elsewhere: email the courthouse scheduling address (see Contacts)."],["Confirmation","Form 37B/38B filed **5 business days** before the hearing (rr. 37.10.1(1), 38.09.1(1))."],["Mode","Short motions: virtual. Consent/unopposed: in writing. Long motions and applications: in person."]]},{"t":"note","label":"READ THE LOCAL NOTICES:","items":["The East Region Practice Direction leaves courthouse-specific procedures to the **SCJ East Region Notices**, which the Court hosts on an external file-sharing site (linked above; it could not be opened when this guide was prepared). Check the Notice for your courthouse before booking. The steps below use the Practice Direction and each courthouse's published scheduling contacts."]}],"h1":true},{"title":"East – Short Motions","blocks":[{"t":"p","text":"Applications and motions estimated at **60 minutes or less** (or up to 120 minutes where a local directive allows, as in Ottawa) are returnable on the **assigned motions court day** for each county, starting at **10:00 a.m.** (PD para. 21)."},{"t":"h3","text":"Ottawa"},{"t":"ol","items":["Agree on the date and time estimate with all parties.","**Judge short motions (2 hours and under):** book on [calendly.com/ottawa-scj-civil](https://calendly.com/ottawa-scj-civil). Forward the Calendly confirmation to all parties. Scheduling questions: ottawa.scj.courts@ontario.ca / 613-293-1054.","**Associate Judge short motions:** email the Associate Judges' office at **mastersofficeottawa@ontario.ca** (613-239-1047), copying all parties, with the court file number, short title, relief sought, time estimate and the agreed dates. **Practice tip:** the Ottawa courthouse page lists both routes without explaining the split; if unsure which list your motion belongs on, ask mastersofficeottawa@ontario.ca first.","**Immediately after booking**, file the Notice of Motion through JSO and **pay the fee**. The Court does not allow \"placeholder\" motions (PD para. 24).","Serve and file the Motion Record and factum within the Rules timelines, then upload to Case Center once the filings are accepted.","**Confirm** by filing Form 37B (or 38B) through JSO **5 business days** before the hearing, and upload it to Case Center."]},{"t":"h3","text":"All Other East Courthouses"},{"t":"ol","items":["Agree on the date with all parties.","Email the courthouse **Short Motions** scheduling address (see Contacts), copying all parties, asking for the next assigned county motions day. Include the court file number, short title, relief sought, time estimate and the parties' availability. **Practice tip:** use the subject line *\"Short Motion Date Request – [File Name and Number]\"*.","File the Notice of Motion and pay the fee **immediately** after the date is given (PD para. 24).","Serve, file and upload materials, then file the Confirmation **5 business days** before."]}]},{"title":"East – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Long motions (over one hour, or over the local limit) are triaged and case managed under each centre's local directive (PD para. 26)."},{"t":"h3","text":"Ottawa"},{"t":"ol","items":["In Ottawa, triage and case management of long motions and applications are handled by the **Associate Judges** (PD para. 26).","Email **mastersofficeottawa@ontario.ca** (613-239-1047), copying all parties, requesting a long motion date or triage. Include: court file number and short title; the relief sought; the time estimate for all parties; whether materials are served; and a proposed timetable for the remaining steps. For a routine case conference, use the Case Management Coordinator's **designated form** from the Ottawa Civil Forms in the East Region Notices (PD para. 34).","The Associate Judge sets the timetable and hearing date (usually at a case conference). Diarize every date in the endorsement.","Serve, file and upload all materials and factums per the timetable, then confirm **5 business days** before."]},{"t":"h3","text":"All Other East Courthouses"},{"t":"ol","items":["Email the courthouse **Long Motions** address (see Contacts), copying all parties, asking for a **special appointment**. Include the court file number, short title, relief sought, time estimate, readiness and a proposed timetable.","The Trial Coordinator offers dates; confirm the agreed date in writing to all parties.","A special appointment must still be **confirmed**. Consent requests to adjourn or reschedule go to the local administrative Judge or case management Judge for approval (PD paras. 28–29)."]}]},{"title":"East – Short Applications","blocks":[{"t":"p","text":"Issue the application through Civil Claims Online, then book it exactly like a short motion (Ottawa Calendly, or the courthouse Short Motions email). Confirm with **Form 38B** five business days before (PD paras. 21–22)."}]},{"title":"East – Long Applications","blocks":[{"t":"p","text":"Issue the application, then follow the long motion steps for your courthouse (Ottawa: Associate Judges' office; elsewhere: Long Motions email for a special appointment). **Commercial applications** (receiverships, CCAA, Norwich and Mareva orders, certain bankruptcies) may go on the **East Region Commercial List**: email the Commercial List request form to **ER.Commercial.List@ontario.ca**; the matter is spoken to at a **9:00 a.m. practice court**, ordinarily on Tuesdays (PD paras. 45–55)."}]},{"title":"East – In Writing, Consent, Without Notice and Urgent","blocks":[{"t":"ul","items":["**Consent and unopposed motions** are heard **in writing**: file the motion record and a draft order (Word) through JSO with the fee.","**Urgent** applications, or urgent motions in an intended proceeding, are started **in Ottawa** to obtain a file number, and may later be transferred under r. 13.1.02. A motion in an existing proceeding is filed where the court file is (PD para. 49). Email the Ottawa scheduling address with the urgency, the relief and a draft order.","**Transfer motions** are brought in writing unless urgent or contested (PD para. 44).","To depart from the presumptive mode of hearing, email the Trial Coordinator (or case management Judge) **well in advance**; judicial approval is required."]}]},{"title":"East – Confirmation","blocks":[{"t":"ol","items":["Complete Form 37B (or 38B), describing **all** materials filed and **all** prior endorsements and orders (PD para. 22).","File it through JSO **five business days** before the hearing (PD para. 22). **Practice tip:** also email a copy to the courthouse scheduling address you booked through, with the subject *\"CONFIRMATION – [File Name and Number] – [Hearing Date]\"*, unless the local Notice says otherwise.","Upload it to the Case Center bundle once accepted."]},{"t":"note","label":"Consequence:","items":["**Unconfirmed motions and applications will not be heard**, and you cannot ask on the day for them to be added to the list (PD para. 23)."]}]},{"title":"East – Materials & Case Center","blocks":[{"t":"ul","items":["Documents must be filed electronically; non-compliant documents are not accepted or uploaded (PD para. 11).","A Compendium is required where more than **30 pages** of documentary evidence are filed (PD para. 13).","Hyperlink case law to a free, non-password-protected source such as CanLII (PD para. 18). Upload draft orders and endorsements in Word (PD para. 18.1).","Send any change of counsel or contact details when you receive the Case Center invite (PD para. 16)."]}]},{"title":"East – Filing and Case Center","blocks":[{"t":"ul","items":["File electronically through Justice Services Online; in-person filing only with a written explanation. Over-length or non-compliant documents are rejected and not uploaded (paras 11–12). The Rules' timelines are \"strictly adhered to\" (para 25).","Documents in each case are filed at the local court where it was started or transferred to (para 50).","Follow the provincial Case Center Guide; non-compliance can stop the hearing (paras 14–15). Hyperlink case law to a free, non-password-protected database (para 18); upload endorsement sheets and draft orders in **Word only** (para 18.1)."]}]},{"title":"East – Mode of Appearance","blocks":[{"t":"table","headers":["Mode","Civil events (Part 1A)"],"rows":[["In person","Trials (jury and non-jury); long motions and applications; appeals to an SCJ judge"],["Virtual","Civil pre-trials; case conferences/case management; Assignment Court/TBST Court; short motions (under 2 hours)"],["In writing","Consent and unopposed motions"]]},{"t":"p","text":"To deviate, cite r. 1.08, discuss it with the other side first, and ask the Trial Coordinator (or case management judge) **well in advance** — judicial approval is required even on consent. Hybrid hearings need advance approval (paras 4–9)."}]},{"title":"East – Case Conferences and Case Management","blocks":[{"t":"ul","items":["For complex cases the RSJ may appoint a **case management judge** under r. 37.15; less formal case conferences (r. 50.13) are available in all civil cases (para 33).","**Ottawa:** case management throu
