gh the Office of the Associate Judges / Case Management Centre — send routine case conference requests to the Case Management Coordinator on the designated form (in the Ottawa Civil Forms of the [East Region Notices](https://ln5.sync.com/dl/7a6d801c0#gh879xzg-k54cxduk-z6kkyvr6-mfsvcw58)), or email **mastersofficeottawa@ontario.ca** (para 34). Associate Judges may convene case conferences and make case management orders without a separate order (para 35)."]}]},{"title":"East – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Pre-trials are generally set at **trial management court** or by the case management / trial coordinator after the trial record is filed; you may also request one (para 30(1)). Ottawa: mastersofficeottawa@ontario.ca.","Briefs: filed **5 days before**, max **20 double-spaced pages**, searchable PDF; serve electronically and post in Case Center — **not** filed in the court record. Key excerpts and hyperlinks are allowed; state the latest settlement position (para 30(2)).","File a **separate witness list** with a short explanation of each witness's connection to the case (para 30(3))."]}]},{"title":"East – Trial Scheduling and Trials","blocks":[{"t":"ul","items":["Trials are in person. Local scheduling practices are in the [East Region Notices](https://ln5.sync.com/dl/7a6d801c0#gh879xzg-k54cxduk-z6kkyvr6-mfsvcw58) (para 32). Ottawa trials and Trial Management Court: mastersofficeottawa@ontario.ca · 613-239-1047.","**Adjournments:** on consent, a written request to the local administrative judge or trial judge in advance; contested adjournment motions on a date arranged with the trial coordinator; otherwise heard at the start of trial (para 31). Tell the trial coordinator promptly if the case settles or narrows."]}]},{"title":"East – Mandatory Mediation (Ottawa)","blocks":[{"t":"ul","items":["**Ottawa** civil actions (other than estates) are subject to **mandatory mediation under r. 24.1**; estates under r. 75.1 (para 37).","The Mediation Coordinator does **not** automatically appoint a mediator, and the 180-day deadline is excused — mediate when it is most likely to succeed, but **before setting the action down for trial**. If you cannot certify mediation is done (or exempt) at set-down, no trial date is assigned and you must attend a case conference to schedule a session (para 38).","A Roster Mediator is assigned if 180 days have passed since a defence and a party asks, or a judge directs; then rr. 24.1.09(7)–(8) and 24.1.10–24.1.16 apply and the parties pay the mediator (O. Reg. 451/98) (paras 39–40)."]}]},{"title":"East – Transfers and Mortgage Proceedings","blocks":[{"t":"ul","items":["**Into the East Region:** a motion in writing to the RSJ or designate (each centre's Local Administrative Judge can approve transfers into that centre) (para 43).","**Within the region:** approval of the RSJ or the receiving centre's LAJ, in writing unless urgent or contested; any other judge's order must be \"subject to the approval of the Local Administrative Judge in that centre\" (para 44).","**Mortgage proceedings** are commenced at the court location serving the county where the land is (Belleville, Brockville, Cornwall, Kingston, L'Orignal, Napanee, Picton, Pembroke, Perth or Ottawa) (para 41)."]}]},{"title":"East – Commercial List","blocks":[{"t":"ol","items":["The **East Region Commercial List** handles time-sensitive and urgent commercial matters, run by analogy to the Toronto Commercial List (paras 45–47). Eligible (at the Team Lead's discretion): Norwich, Mareva and other mandatory orders; receiverships and related motions; CCAA applications; urgent or contested bankruptcies not suited to the regular lists; certain CBCA/OBCA/partnership relief; other matters the Team Lead directs (para 48).","There is no separate registry: an urgent application or motion in an intended proceeding is **commenced in Ottawa** (and can be transferred later); motions in existing files are filed where the file is (para 49).","Once listed, the title of proceedings reads \"**Ontario Superior Court of Justice, East Region Commercial List**\"; the file number does not change (para 52).","To book, send the [East Region Commercial List request form](https://ln5.sync.com/dl/e83f479d0#q64cknyp-3q5sef2p-yvv7u4g2-j47vcs95) to **ER.Commercial.List@ontario.ca**. Matters are spoken to at a **9:00 a.m. practice court, usually Tuesdays**; flag on the form anything too urgent to wait (paras 53–55)."]}]},{"title":"East – Class Actions and Bankruptcy","blocks":[{"t":"ul","items":["**Class actions:** follow the Provincial PD. To have a class proceedings judge assigned and get a hearing date, email **ER.Commercial.List@ontario.ca** with the subject line \"**CP Request to Assign a Judge**\". Class proceedings are case managed like Commercial List cases (paras 56–59). Ottawa contact: mastersofficeottawa@ontario.ca.","**Bankruptcy** matters stay with the **Bankruptcy office in Ottawa** and the regular Bankruptcy Lists; urgent or contested bankruptcies, receiverships and CCAA matters can go on the Commercial List (paras 46, 48, 51)."]}]},{"title":"East – Construction Liens","blocks":[{"t":"p","text":"The PD has no special lien procedure. In Ottawa, construction lien matters (including Associate Judge lien motions) are scheduled through **mastersofficeottawa@ontario.ca · 613-239-1047**; Cornwall and L'Orignal list their own lien contacts (see Contacts)."}]},{"title":"East – Contacts","blocks":[{"t":"table","headers":["Courthouse","Short Motions","Long Motions / Trial Coordination","Phone"],"rows":[["Ottawa","Judge: [calendly.com/ottawa-scj-civil](https://calendly.com/ottawa-scj-civil) / ottawa.scj.courts@ontario.ca · Associate Judge: mastersofficeottawa@ontario.ca","mastersofficeottawa@ontario.ca","613-293-1054 / 613-239-1047"],["Kingston","kingstonscjadmin@ontario.ca","KingstonSCJtrialcoordination@ontario.ca","—"],["Belleville","belleville.scj.courts@ontario.ca","belleville.scj.courts@ontario.ca","613-962-9106 x2067"],["Brockville","SCJBrockvilleTC@ontario.ca","SCJBrockvilleTC@ontario.ca","613-341-2821"],["Cornwall","CornwallSCJTrialCoordination@ontario.ca","CornwallSCJTrialCoordination@ontario.ca","613-930-4571"],["L'Orignal","lorignalcivilsccdivision@ontario.ca","lorignaltrialcoordination@ontario.ca","—"],["Napanee","napanee.scj.courts@ontario.ca","NapaneeSCJtrialcoordination@ontario.ca","—"],["Pembroke","Pembroke.SCJ.Courts@ontario.ca","PembrokeSCJTrialScheduling@ontario.ca","613-732-5490"],["Perth","Perth.SCJ.Courts@ontario.ca","PerthTrialCoordinator@ontario.ca","613-267-9068"],["Picton","picton.scj.courts@ontario.ca","picton.scj.courts@ontario.ca","613-476-6236"]]},{"t":"p","text":"Source: each courthouse's \"Civil Scheduling Contact Information\" table on ontariocourts.ca. Commercial List: ER.Commercial.List@ontario.ca."}]}],"northeast":[{"title":"Chapter 6 — Northeast Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Northeast Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-northeast-region/) (effective May 1, 2026)"],["Courthouses","Sudbury, North Bay, Sault Ste. Marie, Timmins, Cochrane, Haileybury, Parry Sound, Gore Bay (Elliot Lake and Kirkland Lake are Small Claims)"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)"],["Short vs. Long","**One hour or less** = Short. More than one hour (requires a special date) = Long."],["Booking","Short: no booking — serve and file returnable on a regular motions day. Long: first return on a regular list for a timetable, then canvass dates with the **Trial Coordinator** by email."],["Confirmation","No regional rule: follow the Rules (Form 37B / 38B by **2:00 p.m., 5 days** before)."],["Factum limit","**15 pages** (PD para. 14.1)"]]}],"h1":true},{"title":"Northeast – Short Motions","blocks":[{"t":"p","text":"Motions expected to take **one hour or less** are scheduled on a **regular motions day** simply by serving and filing the motion materials within the Rules timelines (PD para. 8). There is no booking request."},{"t":"ol","items":["**Find the regular motions days.** The Practice Direction does not list them. Email the courthouse Trial Coordinator (see Contacts) asking for the upcoming regular civil motions days. In **Sudbury**, ask the court registrar for the list showing which days are before an **Associate Judge** and which before a **Judge** (PD para. 9).","**Agree on the day** with the other side and draft the Notice of Motion returnable that day.","**Serve** the Notice of Motion and Motion Record at least 7 days before, and **file** them with proof of service through JSO within the Rules timelines (PD para. 8).","**Upload** the accepted materials to Case Center.","**Confirm** by filing Form 37B through JSO by **2:00 p.m., 5 days** before the hearing (Rules), and upload it to Case Center."]},{"t":"note","label":"Sudbury – Associate Judge:","items":["In Sudbury, unless the relief is within a Judge's exclusive jurisdiction (r. 37.02(2)), a motion returnable by attendance must be made to **\"the Court\"** and is heard by an **Associate Judge** (PD para. 9). Make sure the Notice of Motion is returnable on an Associate Judge day."]}]},{"title":"Northeast – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Long motions and applications are those that need **more than one hour** and a special date. They are scheduled in two steps (PD para. 10):"},{"t":"ol","items":["**First return – timetable.** Make the motion returnable on a **regular motions list**. Either (a) attend on that first return date to set a timetable with the presiding Judge or Associate Judge, **or** (b) file a **consent timetable signed by all parties that includes a second return date**, and you need not attend.","**Complete all materials**, including factums (required on long motions, 15-page limit) (PD paras. 11, 14.1). Serve and file them through JSO and upload to Case Center.","**Canvass dates.** In the week before the second return date, and only if **all materials including factums** have been served and filed, email the Trial Coordinator (see Contacts), copying all parties, to canvass hearing dates. **Practice tip:** subject line *\"Long Motion – Request for Hearing Dates – [File Name and Number]\"*; state that all materials and factums are filed, the time estimate for all parties, and counsel's availability.","**Second return – hearing date.** At the second return date the Judge or Associate Judge confirms that all materials are filed and fixes the hearing date. If all materials are filed **and** all counsel agree on a proposed date **and file a consent** confirming it, you do not need to attend.","**Confirm** the hearing by filing Form 37B (or 38B) through JSO by **2:00 p.m., 5 days** before."]},{"t":"note","label":"Once a long motion date is set:","items":["It may only be vacated or adjourned by order of a Judge or Associate Judge (PD para. 10.4)."]}]},{"title":"Northeast – Short and Long Applications","blocks":[{"t":"p","text":"Applications are scheduled exactly like motions: one hour or less on a regular motions day; longer applications through the two-step protocol above (first return for a timetable, second return for the hearing date). Contested long applications are presumptively in person. Confirm with **Form 38B**."}]},{"title":"Northeast – In Writing, Consent, Without Notice and Urgent","blocks":[{"t":"ul","items":["Consent, without notice and unopposed motions are heard **in writing** unless the Court orders otherwise. File the motion record and a Word draft order through JSO.","**Rule 48.14 dismissal timelines:** consent or confirmed-unopposed motions (and consent timetables) are brought as **r. 37.12.1 motions in writing** and dealt with as basket motions (by an Associate Judge in Sudbury). A **contested** status hearing motion goes first on a short motions list, where the Judge decides whether it is heard in writing, as a one-hour motion or as a long motion (PD paras. 32–33).","**Urgent matters:** email the courthouse Trial Coordinator with the urgency, the relief sought and a draft order. Email filing is permitted where there is urgency or the hearing is three business days or fewer away (provincial PD)."]}]},{"title":"Northeast – Confirmation and Case Center","blocks":[{"t":"p","text":"The regional Practice Direction has no special civil confirmation procedure, so the **Rules** govern: file **Form 37B** (motions) or **38B** (applications) through JSO by **2:00 p.m., 5 days** before the hearing, then upload it to the Case Center bundle. Upload all materials after the Court accepts them, following the provincial Case Center requirements."}]},{"title":"Northeast – Mode of Appearance","blocks":[{"t":"p","text":"The PD lists no civil presumptive modes, so the provincial ones apply (case conferences and pre-trials virtual, contested long motions in person, etc.). Ask for a different mode by writing to the courthouse Trial Coordinator (para 4). Registrars in Bankruptcy hear matters in writing or by video (para 3)."}]},{"title":"Northeast – Case Conferences","blocks":[{"t":"p","text":"Associate Judges are authorized to convene case conferences and make case management orders under r. 50.13 without a separate order in each case — except construction lien cases (para 13). Request through the courthouse Trial Coordinator."}]},{"title":"Northeast – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Book civil judicial pre-trials on the courthouse **Calendly** in Sudbury, North Bay, Cochrane/Timmins and Sault Ste. Marie (para 5); elsewhere through the Trial Coordinator.","**First pre-trial:** trial counsel and clients are expected; if it does not settle, the judge orders exchange of affidavits of documents (with Schedule A documents), examination and undertaking dates, any refusals motion date, a **Scott Schedule** (and response) before the next date, and the next pre-trial date; plaintiff's counsel takes out the order (para 18).","**Second and later pre-trials:** attendance of trial counsel and clients is **mandatory**; bring detailed positions and supporting documents (paras 19, 21). Non-compliance can attract costs (para 20).","Briefs max **15 pages** (para 14). If still unsettled, the matter goes to the Trial Coordinator for a trial date (para 22)."]}]},{"title":"Northeast – Trial Scheduling","blocks":[{"t":"p","text":"After the final unsettled pre-trial, the judge adjourns the matter to the **Trial Coordinator** to fix a trial date (para 22). Email the courthouse Trial Coordinator (see Contacts)."}]},{"title":"Northeast – Mortgage Proceedings","blocks":[{"t":"p","text":"Mortgage proceedings for property anywhere in the region may be commenced in **North Bay, Parry Sound, Sudbury, Haileybury, Sault Ste. Marie, Cochrane or Gore Bay** (r. 13.1.01(3); para 15)."}]},{"title":"Northeast – Administrative Dismissals (Rule 48.14)","blocks":[{"t":"ul","items":["Since **October 2, 2025**, consent or confirmed unopposed motions on r. 48.14 timelines (and consent timetables) are **motions in writing (r. 37.12.1)** heard as basket motions — before an **Associate Judge in Sudbury**, or a judge or Associate Judge elsewhere (paras 32(1), 33(1)).","A **contested status hearing** motion goes first on a **short motions list**, where the judge decides whether it is heard in writing, as a one-hour motion or as a long motion (paras 32(2), 33(2))."]}]},{"title":"Northeast – Costs Assessments","blocks":[{"t":"ol","items":["Every solicitor-client costs assessment starts with a **pre-assessment hearing** by teleconference, set when the Form 58A documents are filed; the court issues a \"Notice of Assessment – Pre-Assessment Hearing\" (paras 23–25).","Serve the notice and bill of costs on every interested party **at least 7 days** before, then file proof of service immediately (para 26).","The officer helps the parties settle; if not, they confirm filings and service, narrow the issues, fix the time needed and set the assessment date. The court mails the Notice of Appointment within **7 days** (paras 27–30). A party who misses the pre-assessment loses notice of later steps (para 31)."]}]},{"title":"Northeast – Construction Liens","blocks":[{"t":"ul","items":["In **Sudbury**, an Associate Judge hears lien motions not reserved to a judge (where no reference is ordered) and matters brought without notice, such as vacating a lien by payment into court (para 16).","Region-wide, all motions and hearings in a lien action referred to an Associate Judge are heard by an Associate Judge (para 17). Associate Judge case-management authority does not extend to lien cases (para 13)."]}]},{"title":"Northeast – Bankruptcy","blocks":[{"t":"p","text":"Judges and Associate Judges sitting as Registrars in Bankruptcy hear all bankruptcy matters in writing or by video conference, with in-person hearings decided case by case (para 3). No separate Commercial List or class action procedure — follow the Provincial PD."}]},{"title":"Northeast – Contacts","blocks":[{"t":"table","headers":["Courthouse","Trial Coordinator","Calendly (Civil Pre-Trials only)"],"rows":[["Sudbury","Sudbury.SCJ.TC@ontario.ca","[calendly.com/sudbury-scj](https://calendly.com/sudbury-scj)"],["North Bay","NorthBay.scj.tc@ontario.ca","[calendly.com/northbay-scj](https://calendly.com/northbay-scj)"],["Sault Ste. Marie","SaultSteMarie.scj.tc@ontario.ca","[calendly.com/saultstemarie-scj](https://calendly.com/saultstemarie-scj)"],["Cochrane","Cochrane.SCJ.TC@ontario.ca","[calendly.com/cochrane-scj](https://calendly.com/cochrane-scj)"],["Timmins","Cochrane.SCJ.TC@ontario.ca (as listed in the PD)","[calendly.com/timmins-scj](https://calendly.com/timmins-scj)"],["Haileybury","Haileybury.scj.tc@ontario.ca","—"],["Parry Sound","ParrySound.scj.tc@ontario.ca","—"],["Gore Bay / Manitoulin","GoreBay.SCJ.TC@ontario.ca","—"]]}]}],"northwest":[{"title":"Chapter 7 — Northwest Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Northwest Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-northwest-region/) (effective June 30, 2025; dated September 29, 2025)"],["Courthouses","Thunder Bay, Kenora, Fort Frances (Dryden and Red Lake are Small Claims)"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)"],["Short vs. Long","**Less than one hour** = Short. More than one hour = Long."],["Booking","Short: Notice of Motion returnable on the **Thursday Regional Motions list**. Long: email the **Trial Coordinator** for a special date."],["Upload deadline","Short motions: everything in Case Center by **4:00 p.m. on the Tuesday** before the Thursday list."],["Confirmation","Filed through JSO **and** uploaded to Case Center **5 business days** before."]]}],"h1":true},{"title":"Northwest – Short Motions","blocks":[{"t":"p","text":"Short motions (less than one hour) are heard on the **Thursday Regional Motions list** (PD para. 12). You place a motion on the list by making the Notice of Motion returnable on that Thursday and filing it."},{"t":"ol","items":["**Choose a Thursday** with the other side, leaving enough time for the Case Center invite (see step 3).","**File the Notice of Motion and pay the fee** through JSO **as early as possible** (PD paras. 14–15).","**Wait for the Case Center invitation.** Court Services staff send it after the Notice of Motion is filed and the fee paid, usually **within 3 days** but not always (PD para. 14).","**Serve and file** the remaining materials within the Rules timelines.","**Upload by 4:00 p.m. on the Tuesday** before the Thursday hearing, as **separate, numbered documents**: Notice of Motion; each Affidavit; **each Exhibit separately**; Affidavit of Service only if service is in issue; a **hyperlinked factum**; and a separate draft or consent order (PD paras. 11–12).","**Confirm:** file Form 37B through JSO **and** upload it to Case Center **5 business days** before the Thursday (PD paras. 17–18). Court staff will **not** upload it for you (PD para. 20)."]},{"t":"note","label":"WARNING:","items":["A motion not uploaded to Case Center by the Tuesday deadline is **automatically adjourned** to the next Regional Motions Court. Late filing (unless an emergency) is not a reason to proceed (PD para. 13)."]}]},{"title":"Northwest – Long Motions (incl. Summary Judgment)","blocks":[{"t":"p","text":"Civil motions needing **more than one hour** are scheduled **directly with the Trial Coordinator** (PD para. 16)."},{"t":"ol","items":["Agree with all parties on the time estimate, a timetable for the remaining steps and blocks of availability.","Email the Trial Coordinator for your courthouse (see Contacts), copying all parties. **Practice tip:** subject *\"Long Motion – Request for Special Date – [File Name and Number]\"*; include the relief sought, the time estimate for all parties, the agreed timetable and counsel's available dates.","Once a special date is given, file the Notice of Motion returnable that date through JSO and pay the fee.","Serve, file and upload all materials and a **factum** (required on long motions; 20-page limit).","Confirm by filing **and** uploading Form 37B **5 business days** before. A special date may be **adjourned or vacated** if the confirmation is not uploaded (PD para. 22)."]}]},{"title":"Northwest – Short and Long Applications","blocks":[{"t":"p","text":"The Practice Direction does not address applications separately. Issue the application through Civil Claims Online, then apply the same one-hour line: short applications returnable on the **Thursday Regional Motions list** (same upload and confirmation steps), long applications by email to the Trial Coordinator for a special date. Confirm with **Form 38B**."}]},{"title":"Northwest – In Writing, Consent, Without Notice and Urgent","blocks":[{"t":"ul","items":["Consent and unopposed motions are heard in writing unless the Court orders otherwise. If you place a consent motion on the Thursday list, **say it is on consent in the Confirmation** so the Judge does not review the whole file (PD para. 21).","Urgent matters: email the Trial Coordinator with the urgency, relief and a draft order. Email filing is allowed where the hearing is three business days or fewer away.","Sealed or redacted materials are emailed to the Trial Coordinator, never uploaded to Case Center."]}]},{"title":"Northwest – Confirmation","blocks":[{"t":"ol","items":["Confer with the other side (\"Confer with the other side means confer\") (PD para. 20).","Complete Form 37B (38B for applications) with the issues in dispute, the documents the Judge should read, the time required, and whether the motion is on consent (PD para. 21).","**File it** through JSO **and upload it** to the Case Center motion bundle no later than **five business days** before the event (PD paras. 17–18)."]},{"t":"note","label":"Consequence:","items":["A late confirmation may get the matter **struck from the Regional Motions list** or removed from the schedule (PD para. 19)."]}]},{"title":"Northwest – Filing and Case Center","blocks":[{"t":"ul","items":["File electronically; in person only with an explanation. Non-compliant or over-length documents are rejected and not uploaded (paras 7–8).","Follow the [Case Center Guide to Requirements](https://www.ontariocourts.ca/scj/casecenter/) (para 9). Upload each item as a **separate numbered document**: notice of motion or brief; each affidavit; **each exhibit individually** with a description (e.g. \"Exhibit A – Consent dated…\"); affidavits of service only if service is in issue; a factum hyperlinked to authorities and source paragraphs; a hyperlinked compendium of cases if no factum (never a PDF case brief); and a separate draft or consent order (para 11).","The Case Center invitation is sent after the notice of motion is filed and the fee paid — usually within **3 days** (para 14). Filing a pre-trial brief triggers its invitation (para 28)."]}]},{"title":"Northwest – Mode of Appearance","blocks":[{"t":"p","text":"The region runs one regional calendar (Thunder Bay, Kenora, Fort Frances) to give the earliest dates, so many events are presumptively **virtual**. Limited in-person conferences are available in Thunder Bay and Kenora (resident judges) only if both parties agree; none in Fort Frances. Once set, an in-person event cannot become virtual or vice versa (paras 1–5)."}]},{"title":"Northwest – Pre-Trial Conferences","blocks":[{"t":"ol","items":["Before a pre-trial is scheduled, all **expert reports** must be received and served (r. 53.03) (para 23(1)).","File a **Certificate of Readiness 30 days** before the pre-trial (r. 50.03.1), covering experts and whether reports were obtained and served (para 23(2)).","Pre-trials are only scheduled where the trial is **no more than 120 and no less than 30 days** after the pre-trial (or on the first day of the sitting) — in practice, the earliest available Running List (paras 23(3), 24).","Briefs (pre-trial and early resolution): max **15 pages**, with extra documents hyperlinked and uploaded individually; filed **5 days** before — earlier is encouraged to speed up Case Center access (paras 27–29).","**Early resolution conferences** (r. 50.02(3)) are available after the trial record is filed, on consent or order: send the RSJ a summary of the issues and why it would help; use the usual pre-trial form marked \"pre-resolution conference\" (paras 25–26). Costs may be payable immediately for an unproductive pre-trial (r. 50.12)."]}]},{"title":"Northwest – Trial Scheduling and Trials","blocks":[{"t":"ul","items":["A trial date obtained before the pre-trial is confirmed there; otherwise it is obtained at the pre-trial, where the judge places the case on a **Running List** and gives trial management directions (para 30).","Every case on a Running List is **spoken to two months** before the list starts to confirm readiness; the **Trial Confirmation Date** is the **Wednesday before** the list begins (paras 31–32).","The Thunder Bay Trial Coordinator circulates the annual Running Lists, speak-to dates, confirmation dates and Zoom details (para 32)."]},{"t":"note","label":"Not addressed:","items":["The Northwest PD has no mortgage designation, Rule 48.14, transfer, construction lien, Commercial List, class action or bankruptcy provisions — follow the Rules and the Consolidated Civil Provincial PD."]}]},{"title":"Northwest – Contacts","blocks":[{"t":"table","headers":["Courthouse","Trial Coordination Email"],"rows":[["Thunder Bay","ThunderBay.SCJ@ontario.ca"],["Kenora","Kenora.SCJ@ontario.ca"],["Fort Frances","FortFrances.SCJ@ontario.ca"]]}]}],"southwest":[{"title":"Chapter 8 — Southwest Region","blocks":[{"t":"table","headers":null,"rows":[["Practice Direction","[Consolidated Practice Direction – Southwest Region](https://www.ontariocourts.ca/scj/practice_directions/consolidated-practice-direction-for-the-southwest-region-2/) (effective June 30, 2025; updated May 1, 2026)"],["Courthouses","London, Windsor, Chatham, Sarnia, St. Thomas, Stratford, Woodstock, Goderich"],["Filing Portal","[Justice Services Online](https://www.ontario.ca/page/file-civil-or-divisional-court-documents-online)"],["Short vs. Long","**60 minutes or less** = Short. More than 60 minutes for all submissions (including costs) = **Special Appointment**."],["Booking","Short: returnable on the county motions day at 10:00 a.m. Long: Certificate of Readiness (COR) completed by all parties and sent to the **Trial Coordinator**."],["Confirmation","Form 37B/38B filed by **2:00 p.m., 5 business days** before."],["Mode","Special Appointment motions and applications: virtual."]]}],"h1":true},{"title":"Southwest – Short Motions","blocks":[{"t":"p","text":"Applications and motions estimated at **sixty minutes or less** are returnable on the **assigned motions court day** for the county, beginning at **10:00 a.m.** (PD para. 30). There is no booking request."},{"t":"ol","items":["**Find the county motions day.** The Practice Direction does not list them. Email the courthouse civil scheduling address (see Contacts) asking for the upcoming civil motions days.","**Agree on the day** with the other side and serve the Notice of Motion returnable that day at 10:00 a.m.","**File** the Notice of Motion and Motion Record through JSO and serve within the Rules timelines, which are **strictly enforced** (PD para. 35).","**Upload** the accepted materials to Case Center.","**Confirm:** file Form 37B through JSO by **2:00 p.m., 5 business days** before the hearing, describing **all** materials filed and all prior endorsements and orders (PD para. 32). Upload it to Case Center."]},{"t":"p","text":"**Adjournments:** two consent adjournments are allowed. Any further adjournment is presumptively *sine die*, returnable on four days' notice (PD para. 31)."}]},{"title":"Southwest – Special Appointments (Long Motions incl. Summary Judgment)","blocks":[{"t":"p","text":"Any motion or application (including cross-motions, and adding together all related motions) needing **more than 60 minutes** for all submissions, including costs, is adjourned to a **special appointment** date given by the Trial Coordinator (PD paras. 36–37)."},{"t":"ol","items":["**Agree on a timetable** with all parties for every remaining step (responding materials, cross-examinations, factums).","**Complete the [Certificate of Readiness of Special Appointment (\"COR\")](https://www.ontariocourts.ca/scj/files/forms/sw/special-appointment-EN.doc).** **All parties** must complete it. It must confirm that each party is (or will be on the assigned date) ready to proceed, state the total time required, say whether a court reporter is needed, and set out the timetable for any remaining steps (PD para. 37).","**Send the COR to the Trial Coordinator.** The Practice Direction does not say how. **Practice tip:** email the signed COR to the courthouse civil scheduling address (see Contacts), copying all parties, with the subject *\"Certificate of Readiness – Special Appointment – [File Name and Number]\"*.","**The Trial Coordinator provides the special appointment date.** Circulate it and diarize it. Special appointments are **presumptively peremptory** on both parties (PD para. 38).","**Factums:** the moving party serves and files its factum at least **7 days** before; the responding party at least **4 days** before. These can be extended (never shortened) in the COR (PD para. 38).","**Confirm:** file Form 37B (or 38B) through JSO by **2:00 p.m., 5 business days** before (PD paras. 32, 40) and upload it to Case Center."]},{"t":"note","label":"Commercial Matters (London):","items":["Time-sensitive commercial matters: complete the [Time Sensitive – Commercial Scheduling Request](https://www.ontariocourts.ca/scj/files/forms/sw/commercial-scheduling-EN.doc), file it to the attention of the Trial Coordinator, and schedule the date directly with the Trial Coordinator. Non-time-sensitive commercial matters over 60 minutes use the [Certificate of Readiness of Special Appointment of Commercial Matter](https://www.ontariocourts.ca/scj/files/forms/sw/commercial-matter-EN.doc) (PD paras. 47–49)."]}]},{"title":"Southwest – Short and Long Applications","blocks":[{"t":"p","text":"The same 60-minute line applies (PD paras. 30, 36). Issue the application through Civil Claims Online. Short applications are returnable on the county motions day; long applications go to a special appointment by COR. Confirm with **Form 38B** by 2:00 p.m., 5 business days before."}]},{"title":"Southwest – Adjourning a Special Appointment","blocks":[{"t":"ul","items":["Once scheduled, any adjournment or rescheduling needs **court approval**. Tell the Trial Coordinator of any adjournment request or settlement **as soon as possible** (PD para. 38).","**Opposed:** you must attend **in person** to ask for an adjournment or to vacate the date (PD para. 38).","**On consent (London):** file a **motion in writing** to the attention of the local administrative Judge (or case management Judge) (PD para. 39)."]}]},{"title":"Southwest – Confirmation","blocks":[{"t":"p","text":"File Form 37B/38B through JSO no later than **2:00 p.m. five business days** before the hearing, completed co-operatively with the other side, accurately listing **all** materials filed and all prior endorsements and orders (PD para. 32). Upload it to Case Center. **Unconfirmed matters will not be heard** and cannot be added to the list on the day (PD para. 33)."},{"t":"note","label":"London:","items":["A motion that is not confirmed, confirmed late, or otherwise non-compliant is **administratively adjourned one week**. A second failure means the motion is not heard and is **deemed abandoned** (PD para. 34)."]}]},{"title":"Southwest – Materials & Case Center","blocks":[{"t":"ul","items":["Documents must be filed electronically; non-compliant or over-length documents are not accepted (PD para. 17).","A Compendium is required where more than **30 pages** of documentary evidence are filed (PD para. 19).","Hyperlink all case law to a public, non-password-protected source. **Do not file Books of Authorities** unless a case is not publicly available online (PD paras. 24–25)."]}]},{"title":"Southwest – Filing and Case Center","blocks":[{"t":"ul","items":["Documents MUST be filed electronically; over-length or non-compliant documents are rejected and not uploaded (para 17). In person only with an explanation (para 18).","**Compendium** required where more than **30 pages** of documentary evidence are filed (para 19).","Hyperlink case law to a public, non-password-protected database such as CanLII; do **not** file Books of Authorities unless a case is unavailable publicly (paras 24–25). Forward Case Center invites on any change of counsel (para 22).","Case Center guides: [counsel](https://answers.legalprof.thomsonreuters.com/casecenter_canada/outsidecounsel) · [self-represented](https://answers.legalprof.thomsonreuters.com/casecenter_canada/self-represented-lit-1) (para 26)."]}]},{"title":"Southwest – Mode of Appearance","blocks":[{"t":"p","text":"The Chief Justice's presumptive guidelines (effective February 1, 2024) are **strictly enforced**; **long / special appointment motions and applications are virtual** in this region (paras 1–4, 16). Deviation requests go to the trial coordinator or case management judge **well in advance**, need judicial approval and are exceptional (paras 5–6). Gown virtually if you would gown in person (para 7)."}]},{"title":"Southwest – Pre-Trial Conferences","blocks":[{"t":"ul","items":["Briefs max **20 pages** \"except in the rarest of cases\" (para 41(1)).","Do **not** file medical records or reports with the brief; upload them to Case Center as separate documents if you may refer to them (para 41(2)).","Include everything Rule 50 requires, with a **stand-alone witness list** (names and estimated length of evidence) and outstanding steps with completion estimates, to support the r. 50.08 report (para 41(4)).","**London:** pre-trials may be adjourned on consent by motion in writing to the local administrative judge (para 42)."]}]},{"title":"Southwest – Trial Scheduling and Trials","blocks":[{"t":"ul","items":["Civil trials over **three weeks** (jury or non-jury) go into the **Spring and Fall 5-week long trial sittings** (para 43).","**London trial adjournments:** on consent by motion in writing to the local administrative judge before trial; contested adjournment motions on a date arranged with the trial coordinator; otherwise at the start of trial (para 44)."]}]},{"title":"Southwest – Mortgage Proceedings","blocks":[{"t":"p","text":"Mortgage proceedings for property anywhere in the region may be commenced in **London, Windsor, St. Thomas, Chatham, Sarnia, Woodstock, Stratford or Goderich** (r. 13.1.01(3); para 44)."}]},{"title":"Southwest – Commercial List (London) and Bankruptcy","blocks":[{"t":"ol","items":["**Time-sensitive commercial matters in London** include BIA matters beyond the Deputy Registrar's jurisdiction (opposed bankruptcy orders, interim receivers, sale approvals), CCAA, PPSA, CJA and BIA receiverships, Farm Debt Mediation Act, Bank Act realizations, OBCA/CBCA, Partnerships Acts, Bulk Sales Act and related matters (para 47).","Flag time sensitivity by completing the [Time Sensitive – Commercial Scheduling Request](https://www.ontariocourts.ca/scj/files/forms/sw/commercial-scheduling-EN.doc) and filing it to the attention of the Trial Coordinator; the date is set directly with the Trial Coordinator (para 48).","Non-time-sensitive commercial motions go on a regular motions day; over 60 minutes (including costs) use the [Certificate of Readiness of Special Appointment of Commercial Matter](https://www.ontariocourts.ca/scj/files/forms/sw/commercial-matter-EN.doc) and the special appointment process (para 49). Consider asking for a single judge for all motions (r. 37.15; para 50)."]}]},{"title":"Southwest – Contested Estates (Directions)","blocks":[{"t":"p","text":"Contested estates matters over one day (5 hours) need an **order giving directions** before a hearing date. Book the directions motion through the Trial Coordinator at **9:30 a.m.** — 15 minutes if on consent, 30 if contested — with a draft order covering the issues, parties, representation, service, pleadings, discovery, experts, set-down, pre-trial and timetable (paras 52–56)."}]},{"title":"Southwest – Contacts","blocks":[{"t":"table","headers":["Courthouse","Civil Scheduling Email (motions, special appointments, trials)"],"rows":[["London","London.scj@ontario.ca"],["Windsor","windsor.scj@ontario.ca"],["Chatham","chatham.scj@ontario.ca"],["Sarnia","Sarnia.SCJ.Courts@ontario.ca"],["St. Thomas","St.Thomas.SCJ@ontario.ca"],["Stratford","stratford.scj@ontario.ca"],["Woodstock","woodstock.scj@ontario.ca"],["Goderich","goderich.scj@ontario.ca"]]},{"t":"p","text":"Source: each courthouse's \"Civil Scheduling Contact Information\" table on ontariocourts.ca."}]}],"comparison":[{"title":"PART III — REGION COMPARISON CHART","blocks":[{"t":"p","text":"A one-page quick reference. Always confirm details in the regional chapter and the current Practice Direction."},{"t":"table","headers":["Region","Short Limit","Book Short","Book Long","Confirmation Deadline","Confirm How"],"rows":[["Toronto","2 hrs","AJ: Calendly + Request Form via OCPP. Judge: Request Form via OCPP","CPC: Calendly + Requisition via OCPP (2 attendances). AJ: email Long Motion form","Judge: 2 p.m., 10 business days. AJ: 5 days","OCPP + email all parties (+ counsel list for long)"],["Central East","1 hr","Email Trial Coordinator","Triage Court via Calendly (Tue 9 a.m.); materials 14 days before","Moving: 2 p.m., 5 days. Responding: 10 a.m., 4 business days","Short: JSO + Case Center. Long: email TC + JSO + upload"],["Central West","< 1 hr","Courthouse Calendly only (not within 10 days)","Requisition emailed to trial office → Triage Court / Conference","Short: 2 p.m., 5 business days. Long: 2 p.m., 7 days","Email trial office, then Case Center"],["Central South","1 hr","Returnable on a designated motions day","Confirmation adjourning to agreed \"Week of\" Ready List","Moving: 2 p.m., 5 days. Responding: 10 a.m., 4 days","Email TC: \"CONFIRMATION – File Name and No.\" + upload"],["East","60 min (Ottawa 2 hrs)","Ottawa: Calendly / AJ office. Others: courthouse email","Ottawa: Associate Judges. Others: special appointment by email","5 business days","File via JSO + upload"],["Northeast","1 hr","Serve & file for a regular motions day","Regular list for timetable → email TC → 2nd return fixes date","Rules: 2 p.m., 5 days","File via JSO + upload"],["Northwest","< 1 hr","Thursday Regional Motions list; upload by Tue 4 p.m.","Email Trial Coordinator","5 business days","File via JSO AND upload"],["Southwest","60 min","County motions day, 10 a.m.","COR (all parties) → Trial Coordinator","2 p.m., 5 business days","File via JSO (London: 1-week adjournment if late)"]]}],"h1":true},{"title":"Pre-Trials, Trials and Mortgages at a Glance","blocks":[{"t":"table","headers":["Region","Book Pre-Trial","Pre-Trial Brief","Trial Scheduling","Mortgage Proceedings"],"rows":[["Toronto","Court sets it (fixed trial dates); Form 50A 30 days before","Upload to Case Center 5 days before","TBST Court (Mon) / Long Trial Scheduling Court (Wed) via Calendly","Toronto (no designation)"],["Central East","Calendly ce-civil-pretrials (consent) or email if opposed","Max 15 pp; upload 5 days before","Civil Blitz Jan/Sept; Triage Court Tuesdays","Barrie or Oshawa"],["Central West","Calendly (Brampton: Assignment Court)","Joint Form 50.08; experts 90 days before","Assignment Court","County where property is (Grey/Bruce: Owen Sound)"],["Central South","Set with trial dates (Form 2 Consent)","Max 20 pp + exec summary; report 7 days, upload 5 days","Trial scheduling court; Form 2 Consent 3 business days before","Any CS courthouse"],["East","Trial management court / trial coordinator","Max 20 pp; 5 days before; not filed","Per local Notice (Ottawa: Associate Judges office)","Court serving the county of the land"],["Northeast","Calendly (Sudbury, North Bay, Cochrane/Timmins, SSM)","Max 15 pp","Trial Coordinator after final pre-trial","Any of 7 NE courthouses"],["Northwest","Running List; Certificate of Readiness 30 days before","Max 15 pp; 5 days before","Running List; speak-to 2 months before","Not designated"],["Southwest","Trial coordinator","Max 20 pp; separate witness list","Long trials: Spring/Fall 5-week sittings","Any of 8 SW courthouses"]]},{"t":"p","text":"**Portals:** Toronto – Ontario Courts Public Portal. All other regions – Justice Services Online. **Factum limit:** 20 pages (15 in the Northeast)."},{"t":"p","text":"**Abbreviations:** AJ – Associate Judge; TC – Trial Coordinator; OCPP – Ontario Courts Public Portal; JSO – Justice Services Online; COR – Certificate of Readiness; CPC – Civil Practice Court."}]}]};

/* ===================== Section tagging ===================== */
function tagsFor(title) {
  const t = title.toLowerCase(), tags = new Set();
  if (t.startsWith('chapter')) tags.add('glance');
  if (/adjourn/.test(t)) tags.add('adjourn');
  else {
    if (/short/.test(t) && /motion/.test(t)) tags.add('short-motion');
    if (/long motion|special appointment/.test(t)) tags.add('long-motion');

  if (/pre-trial/.test(t)) tags.add('pretrial');
  if (/trial scheduling/.test(t)) tags.add('trial');
  if (/mediation/.test(t)) tags.add('mediation');
  if (/transfer/.test(t)) tags.add('transfer');
  if (/mortgage/.test(t)) tags.add('mortgage');

  if (/estate/.test(t)) tags.add('estates');
  if (/simplified procedure/.test(t)) tags.add('simplified');
  if (/associate judge/.test(t)) tags.add('aj');
  if (/before a judge/.test(t)) tags.add('judge');

}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

}

document.getElementById('ask').addEventListener('submit', e => { e.preventDefault(); const q = document.getElementById('q'); ask(q.value); q.value = ''; closeSide(); });
log.addEventListener('change', e => {
  const dp = e.target.closest('[data-datepick]');
  if (dp && dp.value) { const d = new Date(dp.value + 'T12:00:00'); const lbl = 'Hearing on ' + d.toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); addUser(lbl); respond('deadlines for hearing on ' + dp.value + (ctx.region ? ' in ' + where() : '')); return; }
  const sel = e.target.closest('[data-countysel]');
  if (sel && sel.value) { const label = sel.options[sel.selectedIndex].text; addUser(label); respond(sel.value); }
});
log.addEventListener('click', e => {
  const c = e.target.closest('[data-q]'); if (c) { if (c.dataset.q === '__ics') { downloadIcs(); return; } ask(c.dataset.q, c.textContent); return; }
  if (e.target.closest('[data-copy]')) {
    const m = e.target.closest('.msg'); const btn = e.target.closest('[data-copy]');
    const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = 'Copy as text', 1500); };
    const ta = document.createElement('textarea'); ta.value = m._text; document.body.appendChild(ta); ta.select();
    try { navigator.clipboard ? navigator.clipboard.writeText(m._text).then(done, () => { document.execCommand('copy'); done(); }) : (document.execCommand('copy'), done()); } catch (_) {}
    ta.remove();
  }
  if (e.target.closest('[data-print]')) { const m = e.target.closest('.msg'); document.querySelectorAll('.msg').forEach(x => x.style.display = x === m ? '' : 'none'); m.querySelectorAll('details').forEach(d => d.open = true); window.print(); document.querySelectorAll('.msg').forEach(x => x.style.display = ''); }
});
function welcome() {
  log.innerHTML = '';
  addBot(`<div class="card welcome"><h3>Where are you headed?</h3><p class="lead">Your first stop for Ontario's civil Practice Directions. Ask in plain English — tell me <b>what</b> (a motion, pre-trial, trial date, case conference, transfer, Commercial List filing, deadline…) and <b>where</b> (city or courthouse), and I'll give you the steps, forms, emails, subject lines and deadlines for that courthouse.</p><p class="disclaimer">Works offline once installed. Nothing you type is saved or sent anywhere.</p></div>`, '');
}
document.getElementById('newBtn').onclick = () => { ctx = {}; claim = null; renderCtx(); welcome(); document.getElementById('q').focus(); };
document.getElementById('ctxclear').onclick = () => { ctx = {}; renderCtx(); };
const themeBtn = document.getElementById('themeBtn');
const getTheme = () => { try { return localStorage.getItem('wf-theme'); } catch (_) { return null; } };
const setTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('wf-theme', t); } catch (_) {} };
if (getTheme()) document.documentElement.setAttribute('data-theme', getTheme());
themeBtn.onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(cur === 'dark' ? 'light' : 'dark'); };
const side = document.getElementById('side');
const scrim = document.getElementById('scrim');
const closeSide = () => { side.classList.remove('open'); scrim.classList.remove('show'); };
document.getElementById('menuBtn').onclick = () => { const o = side.classList.toggle('open'); scrim.classList.toggle('show', o); };
scrim.addEventListener('click', closeSide);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
// sidebar
document.getElementById('quick').innerHTML = [['Deadline calculator', 'deadline calculator'], ['Emailing the court (format)', 'email the court subject line'], ['Presumptive modes (virtual/in person)', 'mode of appearance'], ['Transfers between counties', 'transfer'], ['Class actions', 'class action'], ['Commercial List', 'commercial list'], ['Where to issue a claim', 'where do I issue a statement of claim'], ['Rules timelines', 'rules timelines'], ['File naming protocol', 'file naming protocol'], ['How to file (portals)', 'how do I file through the portal'], ['Case Center upload', 'how do I upload to case center'], ['Completing a Confirmation', 'how do I confirm a motion'], ['Compare all regions', 'compare regions'], ['All courthouses', 'list all courthouses']].map(([l, q]) => `<button data-q="${esc(q)}">${esc(l)}</button>`).join('');
document.getElementById('quick').onclick = e => { const b = e.target.closest('[data-q]'); if (b) { ask(b.dataset.q); closeSide(); } };
const NAV = [['general', 'Part I — General'], ['provincial', 'Province-Wide Rules'], ...REGION_ORDER.map(r => [r, REGIONS[r].name]), ['comparison', 'Part III — Comparison']];
document.getElementById('nav').innerHTML = NAV.map(([k, n]) => `<div class="nav-region"><button data-toggle>${esc(n)}<span class="caret">▶</span></button><div class="nav-secs">${SECS[k].filter(s => s.blocks.length).map(s => `<button data-sec="${k}:${s.idx}">${esc(stripRegionPrefix(s.title).replace(/^Chapter \d+ — .*/, 'At a glance'))}</button>`).join('')}</div></div>`).join('');
document.getElementById('nav').onclick = e => {
  const t = e.target.closest('[data-toggle]'); if (t) { t.parentElement.classList.toggle('open'); return; }
  const b = e.target.closest('[data-sec]'); if (!b) return;
  const [k, i] = b.dataset.sec.split(':'); const s = SECS[k][+i];
  if (REGIONS[k]) { ctx = { region: k }; renderCtx(); }
  addUser(`${REGIONS[k] ? REGIONS[k].name + ' — ' : ''}${stripRegionPrefix(s.title)}`);
  answer({ title: stripRegionPrefix(s.title).replace(/^Chapter \d+ — /, ''), tags: REGIONS[k] ? [REGIONS[k].name] : [], sections: [{ title: 'Details', blocks: s.blocks }] });
  closeSide();
};
welcome();
window.__mb = { ask, parse, get ctx() { return ctx; } };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
